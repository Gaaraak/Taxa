<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chinchilla vs Dachshund: Boss Climb</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070913;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: none;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Верхний HUD */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-left: 16px;
      padding-right: 16px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hud-chip {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 6px 14px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .zone-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 5px 16px;
      border-radius: 20px;
    }
    .zone-indicator span.sub {
      font-size: 9px;
      color: #fbbf24;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .zone-indicator span.val {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }

    /* Прогресс-бар */
    .climb-progress {
      width: 100%;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 6px 12px;
      backdrop-filter: blur(10px);
    }
    .climb-track {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }
    .climb-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #f59e0b, #ef4444);
      border-radius: 4px;
      transition: width 0.15s ease-out;
    }

    /* Сенсорные кнопки */
    #touch-panel {
      position: absolute;
      bottom: 24px;
      left: 0;
      width: 100%;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 10;
    }

    .ctrl-group {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .t-btn {
      width: 66px;
      height: 66px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 22px;
      transition: transform 0.08s, background 0.08s;
    }
    .t-btn span.label {
      font-size: 9px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .t-btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.25);
    }

    .jump-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: radial-gradient(circle, #f59e0b, #d97706);
      border: 2px solid #fef08a;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
    }

    /* Победное меню (Убийство Таксы) */
    #victory-modal {
      position: absolute;
      inset: 0;
      background: rgba(7, 9, 19, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      color: white;
      text-align: center;
      padding: 24px;
    }
    #victory-modal h1 {
      font-size: 28px;
      color: #ef4444;
      margin-bottom: 6px;
      text-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
    }
    #victory-modal p {
      color: #cbd5e1;
      font-size: 14px;
      max-width: 300px;
      line-height: 1.4;
      margin-bottom: 20px;
    }
    .stats-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 14px 24px;
      margin-bottom: 24px;
      display: flex;
      gap: 20px;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stat-item .stat-title {
      font-size: 11px;
      color: #94a3b8;
    }
    .stat-item .stat-num {
      font-size: 20px;
      font-weight: 800;
      color: #f59e0b;
    }

    .btn-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 280px;
    }

    .act-btn {
      color: white;
      font-weight: 800;
      font-size: 15px;
      border: none;
      padding: 14px 20px;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .act-btn:active {
      transform: scale(0.96);
    }
    .share-btn {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.5);
    }
    .endless-btn {
      background: linear-gradient(135deg, #f59e0b, #b45309);
    }
  </style>
</head>
<body>

<div id="container">
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="top-bar">
      <div class="hud-chip">
        <span>🌭</span>
        <span id="hotdogs-txt">0</span>
      </div>

      <div class="zone-indicator">
        <span class="sub" id="zone-sub">Этаж 1</span>
        <span class="val" id="zone-title">Пентхаус</span>
      </div>

      <div class="hud-chip" style="color: #38bdf8;">
        <span id="height-txt">0.0 м</span>
      </div>
    </div>

    <div class="climb-progress">
      <div style="display: flex; justify-content: space-between; font-size: 10px; color: #94a3b8; font-weight: 700;">
        <span>БОСС-ТАКСА НА ВЕРШИНЕ</span>
        <span id="goal-percent">0%</span>
      </div>
      <div class="climb-track">
        <div class="climb-fill" id="climb-bar"></div>
      </div>
    </div>
  </div>

  <div id="touch-panel">
    <div class="ctrl-group">
      <div class="t-btn" id="btn-left">◀<span class="label">Влево</span></div>
      <div class="t-btn" id="btn-right">▶<span class="label">Вправо</span></div>
    </div>
    <div class="ctrl-group">
      <div class="t-btn" id="btn-crouch">▼<span class="label">Скат</span></div>
      <div class="t-btn jump-btn" id="btn-jump">▲<span class="label">Прыжок</span></div>
    </div>
  </div>

  <div id="victory-modal">
    <h1>💥 ТАКСА ПОВЕРЖЕНА!</h1>
    <p>Шиншилла добралась до крыши и раздавила гигантскую таксу в лепешку!</p>
    
    <div class="stats-card">
      <div class="stat-item">
        <span class="stat-title">Хот-доги</span>
        <span class="stat-num" id="win-hotdogs">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-title">Время</span>
        <span class="stat-num" id="win-time">00:00</span>
      </div>
      <div class="stat-item">
        <span class="stat-title">Статус</span>
        <span class="stat-num" style="color:#4ade80;">БОСС УБИТ</span>
      </div>
    </div>

    <div class="btn-col">
      <button class="act-btn share-btn" id="btn-share">Похвастаться другу ✉️</button>
      <button class="act-btn endless-btn" id="btn-continue">Бесконечный космос 🚀</button>
    </div>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      tg.headerColor = '#070913';
    } catch(e) {}
  }

  function haptic(type = 'light') {
    try {
      if (tg?.HapticFeedback) {
        if (type === 'light') tg.HapticFeedback.impactOccurred('light');
        if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
        if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      }
    } catch(e) {}
  }

  // Web Audio синтезатор
  class SoundFX {
    constructor() { this.ctx = null; }
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    }
    tone(freq, type = 'sine', duration = 0.1, stopVol = 0.001) {
      if (!this.ctx) return;
      try {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        g.gain.setValueAtTime(0.2, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(stopVol, this.ctx.currentTime + duration);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      } catch(e) {}
    }
    jump() { this.tone(420, 'triangle', 0.12); }
    wall() { this.tone(580, 'sine', 0.1); }
    eat() { this.tone(880, 'sine', 0.14); }
    bossHit() {
      if (!this.ctx) return;
      this.tone(140, 'sawtooth', 0.4);
      setTimeout(() => this.tone(80, 'square', 0.5), 100);
    }
  }
  const sfx = new SoundFX();

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.resetTransform?.();
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  // Физика
  const GRAVITY = 1750;
  const AIR_RESIST = 0.992;
  const GROUND_FRICTION = 0.85;

  const player = {
    x: W / 2,
    y: H - 150,
    vx: 0,
    vy: 0,
    r: 16,
    facing: 1,

    isGrounded: false,
    isLedgeClimbing: false,
    stumbleTimer: 0,
    chargeTime: 0,

    squash: 1,
    stretch: 1,
    tailAngle: 0,
    pawCycle: 0,

    hotdogs: 0,
    reset() {
      this.x = W / 2;
      this.y = H - 150;
      this.vx = 0;
      this.vy = 0;
      this.isLedgeClimbing = false;
      this.stumbleTimer = 0;
    }
  };

  const input = {
    left: false,
    right: false,
    crouch: false,
    jumpPressed: false,
    jumpHeld: false
  };

  // Красивые зоны с детальными оттенками
  const ZONES = [
    { maxH: 25, name: 'Пентхаус', sub: 'Этаж 1', bg1: '#111827', bg2: '#311042', platColor: '#78350f', platEdge: '#d97706' },
    { maxH: 55, name: 'Кирпичный чердак', sub: 'Этаж 2', bg1: '#0f172a', bg2: '#1e293b', platColor: '#64748b', platEdge: '#cbd5e1' },
    { maxH: 90, name: 'Неоновые крыши', sub: 'Этаж 3', bg1: '#050515', bg2: '#0b192c', platColor: '#1e1b4b', platEdge: '#06b6d4' },
    { maxH: 9999, name: 'Лунная стратосфера', sub: 'Финал', bg1: '#020617', bg2: '#1e0538', platColor: '#581c87', platEdge: '#f43f5e' }
  ];

  let currentZone = ZONES[0];
  let platforms = [];
  let hotdogs = [];
  let particles = [];
  let stars = [];
  let cityBuildings = [];
  let cameraY = 0;
  let maxHeight = 0;
  let gameStartTime = performance.now();
  let gameWon = false;
  let endlessMode = false;

  // Босс Такса
  const boss = {
    x: W / 2,
    y: -4450,
    w: 130,
    h: 46,
    alive: true,
    squishAnim: 0,
    patrolDir: 1,
    patrolSpeed: 70
  };

  function initWorld() {
    platforms = [];
    hotdogs = [];
    particles = [];
    cameraY = 0;
    maxHeight = 0;
    gameWon = false;
    gameStartTime = performance.now();
    boss.alive = true;
    boss.squishAnim = 0;
    boss.y = -4460;
    boss.x = W / 2 - boss.w / 2;

    // Звезды параллакса
    stars = [];
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 2 + 0.8,
        alpha: 0.3 + Math.random() * 0.7
      });
    }

    // Силуэты зданий для красивого фона
    cityBuildings = [];
    for (let i = 0; i < 10; i++) {
      cityBuildings.push({
        x: i * (W / 7) - 20,
        w: W / 6.5,
        h: 180 + Math.random() * 220
      });
    }

    // Пол
    platforms.push({ x: 0, y: H - 60, w: W, h: 60, type: 'start' });

    // Генерация подъема до крыши (высота 100 метров, y: ~ -4450)
    let curY = H - 160;
    while (curY > -4400) {
      const hMeters = (H - 150 - curY) / 45;
      const zone = getZone(hMeters);

      const w = 75 + Math.random() * 75;
      const x = 30 + Math.random() * (W - 60 - w);
      platforms.push({ x, y: curY, w, h: 18, zone });

      // Спавн хот-догов
      if (Math.random() < 0.65) {
        hotdogs.push({ x: x + w / 2, y: curY - 20, collected: false });
      }

      curY -= (75 + Math.random() * 45);
    }

    // Арена Босса на вершине
    platforms.push({
      x: W / 2 - 120,
      y: -4400,
      w: 240,
      h: 24,
      zone: ZONES[3]
    });
  }

  function getZone(hMeters) {
    for (const z of ZONES) {
      if (hMeters <= z.maxH) return z;
    }
    return ZONES[ZONES.length - 1];
  }

  // Частицы
  function emitDust(x, y, count = 6, color = 'rgba(255,255,255,0.7)') {
    for (let i = 0; i < count; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 120,
        vy: -Math.random() * 60,
        life: 0.35 + Math.random() * 0.25,
        color
      });
    }
  }

  function emitSausageExplosion(x, y) {
    const parts = ['#ef4444', '#b91c1c', '#f59e0b', '#fef08a', '#78350f'];
    for (let i = 0; i < 90; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 450,
        vy: -150 - Math.random() * 400,
        life: 1.5 + Math.random() * 1.0,
        color: parts[Math.floor(Math.random() * parts.length)],
        size: 4 + Math.random() * 6
      });
    }
  }

  // Ввод
  window.addEventListener('keydown', (e) => {
    sfx.init();
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.left = true;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') input.right = true;
    if (e.code === 'KeyS' || e.code === 'ArrowDown') input.crouch = true;
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      if (!input.jumpHeld) input.jumpPressed = true;
      input.jumpHeld = true;
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.left = false;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') input.right = false;
    if (e.code === 'KeyS' || e.code === 'ArrowDown') input.crouch = false;
    if (e.code === 'Space' || e.code === 'ArrowUp') input.jumpHeld = false;
  });

  function bindTouch(btn, onDown, onUp) {
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      sfx.init();
      onDown();
    }, { passive: false });
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (onUp) onUp();
    }, { passive: false });
  }

  bindTouch(document.getElementById('btn-left'), () => { input.left = true; }, () => { input.left = false; });
  bindTouch(document.getElementById('btn-right'), () => { input.right = true; }, () => { input.right = false; });
  bindTouch(document.getElementById('btn-crouch'), () => { input.crouch = true; }, () => { input.crouch = false; });
  bindTouch(document.getElementById('btn-jump'), () => {
    if (!input.jumpHeld) input.jumpPressed = true;
    input.jumpHeld = true;
  }, () => {
    input.jumpHeld = false;
  });

  // Победа и отправка в Telegram
  function killBoss() {
    if (!boss.alive || gameWon) return;
    boss.alive = false;
    gameWon = true;

    player.vy = -620; // высокий победный отскок
    sfx.bossHit();
    haptic('success');
    emitSausageExplosion(boss.x + boss.w / 2, boss.y + boss.h / 2);

    const totalSeconds = Math.floor((performance.now() - gameStartTime) / 1000);
    const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
    const s = (totalSeconds % 60).toString().padStart(2, '0');
    const timeStr = `${m}:${s}`;

    document.getElementById('win-hotdogs').innerText = player.hotdogs;
    document.getElementById('win-time').innerText = timeStr;

    // Настройка кнопки пересылки в Telegram
    document.getElementById('btn-share').onclick = () => {
      const shareText = encodeURIComponent(
        `🐹 Я прошел паркур на 100 метров за ${timeStr}, съел ${player.hotdogs} хот-догов 🌭 и УБИЛ БОСС-ТАКСУ! Сможешь побить мой рекорд?`
      );
      const shareUrl = `https://t.me/share/url?url=&text=${shareText}`;
      if (tg?.openTelegramLink) {
        tg.openTelegramLink(shareUrl);
      } else {
        window.open(shareUrl, '_blank');
      }
    };

    setTimeout(() => {
      document.getElementById('victory-modal').style.display = 'flex';
    }, 700);
  }

  document.getElementById('btn-continue').onclick = () => {
    document.getElementById('victory-modal').style.display = 'none';
    endlessMode = true;
  };

  // Главный цикл обновлений
  let lastTime = performance.now();

  function update(dt) {
    if (player.stumbleTimer > 0) {
      player.stumbleTimer -= dt;
      player.vx *= 0.7;
      return;
    }

    if (player.isLedgeClimbing) {
      player.vy = -200;
      player.vx = player.facing * 110;
      if (player.vy > -10) player.isLedgeClimbing = false;
    }

    // Зарядка прыжка шиншиллы
    if (player.isGrounded && input.jumpHeld) {
      player.chargeTime = Math.min(player.chargeTime + dt * 3.4, 1.0);
      player.squash = 1.35;
      player.stretch = 0.7;
      player.vx *= 0.65;
    } else if (player.chargeTime > 0) {
      const jumpPower = 450 + player.chargeTime * 450;
      player.vy = -jumpPower;
      player.vx += player.facing * (140 * player.chargeTime);
      player.isGrounded = false;
      player.squash = 0.65;
      player.stretch = 1.45;
      player.chargeTime = 0;
      sfx.jump();
      haptic('light');
      emitDust(player.x, player.y + player.r, 8);
    }

    // Горизонтальный бег
    const accel = player.isGrounded ? 1250 : 500;
    if (input.left && !player.isLedgeClimbing) {
      player.vx -= accel * dt;
      player.facing = -1;
    } else if (input.right && !player.isLedgeClimbing) {
      player.vx += accel * dt;
      player.facing = 1;
    } else if (player.isGrounded) {
      player.vx *= GROUND_FRICTION;
    } else {
      player.vx *= AIR_RESIST;
    }

    const maxSpeed = 350;
    if (Math.abs(player.vx) > maxSpeed) {
      player.vx = Math.sign(player.vx) * maxSpeed;
    }

    if (!player.isLedgeClimbing) {
      player.vy += GRAVITY * dt;
    }

    player.x += player.vx * dt;
    player.y += player.vy * dt;

    if (player.isGrounded && Math.abs(player.vx) > 20) {
      player.pawCycle += dt * 20;
    }
    player.tailAngle += (((player.vy * 0.0016) - (player.vx * 0.001)) - player.tailAngle) * 10 * dt;

    player.squash += (1 - player.squash) * 9 * dt;
    player.stretch += (1 - player.stretch) * 9 * dt;

    // Отскок от стен
    if (player.x - player.r < 10) {
      player.x = 10 + player.r;
      if (!player.isGrounded && input.jumpPressed) {
        player.vx = 320;
        player.vy = -520;
        player.facing = 1;
        player.stretch = 1.35;
        sfx.wall();
        haptic('medium');
        emitDust(player.x, player.y, 8);
      } else {
        player.vx = 0;
      }
    } else if (player.x + player.r > W - 10) {
      player.x = W - 10 - player.r;
      if (!player.isGrounded && input.jumpPressed) {
        player.vx = -320;
        player.vy = -520;
        player.facing = -1;
        player.stretch = 1.35;
        sfx.wall();
        haptic('medium');
        emitDust(player.x, player.y, 8);
      } else {
        player.vx = 0;
      }
    }
    input.jumpPressed = false;

    // Поведение Босса Таксы (патруль арены)
    if (boss.alive) {
      boss.x += boss.patrolDir * boss.patrolSpeed * dt;
      if (boss.x < W / 2 - 100) boss.patrolDir = 1;
      if (boss.x + boss.w > W / 2 + 100) boss.patrolDir = -1;

      // Проверка прыжка шиншиллы сверху на таксу
      if (
        player.vy > 0 &&
        player.x + player.r > boss.x &&
        player.x - player.r < boss.x + boss.w &&
        player.y + player.r >= boss.y &&
        player.y + player.r <= boss.y + 24
      ) {
        killBoss();
      }
    }

    // Коллизии с платформами
    const wasGrounded = player.isGrounded;
    player.isGrounded = false;
    player.isLedgeClimbing = false;

    for (const p of platforms) {
      if (
        player.vy >= 0 &&
        player.x + player.r * 0.6 > p.x &&
        player.x - player.r * 0.6 < p.x + p.w &&
        player.y + player.r >= p.y &&
        player.y + player.r <= p.y + p.h + 12
      ) {
        const impact = player.vy;
        player.y = p.y - player.r;
        player.vy = 0;
        player.isGrounded = true;

        if (impact > 800) {
          if (input.crouch) {
            player.vx = player.facing * 280;
            player.squash = 1.4;
            haptic('light');
          } else {
            player.stumbleTimer = 0.4;
            player.squash = 1.6;
            player.stretch = 0.55;
            haptic('heavy');
          }
          emitDust(player.x, player.y + player.r, 10);
        } else if (!wasGrounded) {
          player.squash = 1.25;
          player.stretch = 0.8;
          emitDust(player.x, player.y + player.r, 4);
        }
        break;
      }

      // Хват за край
      if (!player.isGrounded && player.vy > -50 && player.vy < 380) {
        const leftEdge = Math.abs((player.x + player.r) - p.x) < 8 && Math.abs(player.y - p.y) < 14;
        const rightEdge = Math.abs((player.x - player.r) - (p.x + p.w)) < 8 && Math.abs(player.y - p.y) < 14;

        if (leftEdge || rightEdge) {
          player.isLedgeClimbing = true;
          player.facing = leftEdge ? 1 : -1;
          break;
        }
      }
    }

    // Сбор хот-догов
    for (const hd of hotdogs) {
      if (hd.collected) continue;
      if (Math.hypot(player.x - hd.x, player.y - hd.y) < player.r + 14) {
        hd.collected = true;
        player.hotdogs++;
        sfx.eat();
        haptic('light');
        emitDust(hd.x, hd.y, 8, '#f59e0b');
        document.getElementById('hotdogs-txt').innerText = player.hotdogs;
      }
    }

    // Бесконечный спавн в космосе
    if (endlessMode) {
      const topP = platforms[platforms.length - 1];
      if (topP && topP.y > cameraY - 300) {
        const w = 70 + Math.random() * 80;
        const x = 30 + Math.random() * (W - 60 - w);
        platforms.push({ x, y: topP.y - (80 + Math.random() * 50), w, h: 18, zone: ZONES[3] });
      }
    }

    // Камера
    const targetCamY = player.y - H * 0.6;
    cameraY += (targetCamY - cameraY) * 5 * dt;

    // Высота и зона
    const hMeters = Math.max(0, (H - 150 - player.y) / 45);
    if (hMeters > maxHeight) maxHeight = hMeters;

    currentZone = getZone(maxHeight);
    document.getElementById('zone-sub').innerText = currentZone.sub;
    document.getElementById('zone-title').innerText = currentZone.name;
    document.getElementById('height-txt').innerText = `${maxHeight.toFixed(1)} м`;

    const progressPct = Math.min(100, Math.floor((maxHeight / 100) * 100));
    document.getElementById('goal-percent').innerText = `${progressPct}%`;
    document.getElementById('climb-bar').style.width = `${progressPct}%`;

    // Падение вниз
    if (player.y > cameraY + H + 120) {
      player.reset();
      initWorld();
    }

    // Частицы
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.size) p.vy += 350 * dt; // гравитация для сосисок
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // Отрисовка Хот-Дога
  function drawHotdog(x, y) {
    ctx.save();
    ctx.translate(x, y);

    // Булочка
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.ellipse(0, 0, 14, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Сосиска
    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    ctx.ellipse(0, -1, 16, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Горчичная полоска зигзагом
    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-10, -2);
    ctx.lineTo(-5, 0);
    ctx.lineTo(0, -2);
    ctx.lineTo(5, 0);
    ctx.lineTo(10, -2);
    ctx.stroke();

    ctx.restore();
  }

  // Отрисовка Босса Таксы
  function drawDachshund(x, y, w, h, dir) {
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2);
    ctx.scale(dir, 1);

    // Длинное сосисочное тело
    ctx.fillStyle = '#854d0e';
    ctx.beginPath();
    ctx.roundRect(-w / 2 + 15, -10, w - 30, 20, 10);
    ctx.fill();

    // Полосатый смешной свитер на теле
    ctx.fillStyle = '#dc2626';
    ctx.fillRect(-w / 2 + 30, -10, 12, 20);
    ctx.fillRect(-w / 2 + 54, -10, 12, 20);
    ctx.fillStyle = '#facc15';
    ctx.fillRect(-w / 2 + 42, -10, 12, 20);

    // Короткие лапки
    ctx.fillStyle = '#713f12';
    ctx.fillRect(-w / 2 + 22, 10, 8, 12);
    ctx.fillRect(-w / 2 + 36, 10, 8, 12);
    ctx.fillRect(w / 2 - 36, 10, 8, 12);
    ctx.fillRect(w / 2 - 22, 10, 8, 12);

    // Голова таксы
    ctx.fillStyle = '#a16207';
    ctx.beginPath();
    ctx.ellipse(w / 2 - 6, -8, 18, 14, 0.2, 0, Math.PI * 2);
    ctx.fill();

    // Длинная мордочка
    ctx.beginPath();
    ctx.ellipse(w / 2 + 10, -4, 14, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // Нос
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(w / 2 + 23, -4, 3, 0, Math.PI * 2);
    ctx.fill();

    // Висячее ухо
    ctx.fillStyle = '#713f12';
    ctx.beginPath();
    ctx.ellipse(w / 2 - 12, -2, 7, 16, 0.4, 0, Math.PI * 2);
    ctx.fill();

    // Глаз (сердитый)
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(w / 2 + 2, -10, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(w / 2 + 3, -10, 1.8, 0, Math.PI * 2);
    ctx.fill();

    // Тонкий хвостик-антенна сзади
    ctx.strokeStyle = '#713f12';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-w / 2 + 16, -2);
    ctx.quadraticCurveTo(-w / 2, -16, -w / 2 + 4, -22);
    ctx.stroke();

    ctx.restore();
  }

  // Отрисовка Шиншиллы
  function drawChinchilla(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(player.facing * player.squash, player.stretch);

    const lean = (player.vx * 0.001) * player.facing;
    ctx.rotate(lean);

    // Хвост
    ctx.save();
    ctx.translate(-player.r * 0.7, player.r * 0.1);
    ctx.rotate(-player.tailAngle);
    ctx.beginPath();
    ctx.ellipse(-14, -4, 16, 8, -0.2, 0, Math.PI * 2);
    ctx.fillStyle = '#64748b';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-24, -8, 12, 6, -0.4, 0, Math.PI * 2);
    ctx.fillStyle = '#475569';
    ctx.fill();
    ctx.restore();

    // Задняя лапка
    ctx.beginPath();
    ctx.ellipse(-player.r * 0.2, player.r * 0.65, 8, 5, 0.2, 0, Math.PI * 2);
    ctx.fillStyle = '#e2e8f0';
    ctx.fill();

    // Тело
    ctx.beginPath();
    ctx.ellipse(0, 0, player.r * 1.1, player.r * 0.95, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#94a3b8';
    ctx.fill();

    // Животик
    ctx.beginPath();
    ctx.ellipse(player.r * 0.35, player.r * 0.15, player.r * 0.6, player.r * 0.65, 0.1, 0, Math.PI * 2);
    ctx.fillStyle = '#f8fafc';
    ctx.fill();

    // Передние лапки
    ctx.beginPath();
    const pawShift = Math.sin(player.pawCycle) * 3;
    ctx.ellipse(player.r * 0.5 + pawShift, player.r * 0.55, 4, 3, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#fbcfe8';
    ctx.fill();

    // Ушки
    ctx.beginPath();
    ctx.ellipse(-player.r * 0.3, -player.r * 0.9, 6, 12, -0.25, 0, Math.PI * 2);
    ctx.fillStyle = '#64748b';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-player.r * 0.3, -player.r * 0.9, 3.5, 8, -0.25, 0, Math.PI * 2);
    ctx.fillStyle = '#fda4af';
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(player.r * 0.25, -player.r * 0.9, 6, 12, 0.2, 0, Math.PI * 2);
    ctx.fillStyle = '#64748b';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(player.r * 0.25, -player.r * 0.9, 3.5, 8, 0.2, 0, Math.PI * 2);
    ctx.fillStyle = '#fda4af';
    ctx.fill();

    // Глаз
    ctx.beginPath();
    ctx.arc(player.r * 0.45, -player.r * 0.15, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = '#090d16';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(player.r * 0.48, -player.r * 0.18, 1.2, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    // Носик и усы
    ctx.beginPath();
    ctx.arc(player.r * 0.88, 0, 2, 0, Math.PI * 2);
    ctx.fillStyle = '#fb7185';
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(player.r * 0.8, -1); ctx.lineTo(player.r * 1.4, -4);
    ctx.moveTo(player.r * 0.8, 1);  ctx.lineTo(player.r * 1.5, 2);
    ctx.moveTo(player.r * 0.8, 3);  ctx.lineTo(player.r * 1.35, 7);
    ctx.stroke();

    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    // Плавный градиент биома
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, currentZone.bg1);
    bg.addColorStop(1, currentZone.bg2);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Звезды
    for (const s of stars) {
      ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
      ctx.fillRect(s.x, (s.y - cameraY * 0.15) % H, s.size, s.size);
    }

    // Силуэты зданий вдалеке (эффект ночного города)
    if (maxHeight > 20 && maxHeight < 85) {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.4)';
      for (const b of cityBuildings) {
        const bY = H - b.h - (cameraY * 0.1);
        ctx.fillRect(b.x, bY, b.w, b.h + 200);
        // Неоновые окошки
        ctx.fillStyle = 'rgba(251, 191, 36, 0.3)';
        ctx.fillRect(b.x + 8, bY + 20, 6, 8);
        ctx.fillRect(b.x + 22, bY + 20, 6, 8);
        ctx.fillStyle = 'rgba(15, 23, 42, 0.4)';
      }
    }

    ctx.save();
    ctx.translate(0, -cameraY);

    // Платформы
    for (const p of platforms) {
      const z = p.zone || currentZone;
      ctx.fillStyle = z.platColor || '#475569';
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, p.h, 6);
      ctx.fill();

      // Верхняя кромка
      ctx.fillStyle = z.platEdge || '#94a3b8';
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, 3, [6, 6, 0, 0]);
      ctx.fill();
    }

    // Босс Такса
    if (boss.alive) {
      drawDachshund(boss.x, boss.y, boss.w, boss.h, boss.patrolDir);
      // Подсказка над таксой
      ctx.fillStyle = '#ef4444';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⚡ ПРЫГНИ НА ГОЛОВУ! ⚡', boss.x + boss.w / 2, boss.y - 14);
    }

    // Хот-доги
    for (const hd of hotdogs) {
      if (hd.collected) continue;
      drawHotdog(hd.x, hd.y);
    }

    // Частицы
    for (const pt of particles) {
      ctx.fillStyle = pt.color;
      if (pt.size) {
        ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
      } else {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Шиншилла
    drawChinchilla(player.x, player.y);

    ctx.restore();
  }

  function frame(now) {
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.033) dt = 0.033;

    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  initWorld();
  requestAnimationFrame(frame);
</script>
