<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Beatmaker Case Drop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #07090e;
      --panel: rgba(15, 19, 32, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --gold: #f59e0b;
      --common: #64748b;
      --rare: #38bdf8;
      --epic: #c084fc;
      --legendary: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(245, 158, 11, 0.06) 0%, transparent 50%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)) 16px;
      overflow-x: hidden;
    }

    /* Верхняя панель */
    header {
      text-align: center;
      margin-top: 4px;
    }

    .badge-top {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .badge-top .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    header h1 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(180deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Рулетка */
    .roulette-wrap {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 146px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
    }

    /* Световые маски по краям */
    .roulette-wrap::before, .roulette-wrap::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 60px;
      z-index: 5;
      pointer-events: none;
    }
    .roulette-wrap::before {
      left: 0;
      background: linear-gradient(90deg, #090c15 15%, transparent);
    }
    .roulette-wrap::after {
      right: 0;
      background: linear-gradient(-90deg, #090c15 15%, transparent);
    }

    /* Лазерный маркер центра */
    .marker {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 100%;
      background: linear-gradient(180deg, #f59e0b, #ef4444);
      box-shadow: 0 0 14px #f59e0b, 0 0 4px #fff;
      z-index: 10;
    }
    .marker::before, .marker::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
    }
    .marker::before {
      top: 2px;
      border-top: 8px solid #f59e0b;
    }
    .marker::after {
      bottom: 2px;
      border-bottom: 8px solid #f59e0b;
    }

    /* Движущаяся лента */
    .tape {
      display: flex;
      gap: 12px;
      padding-left: 200px;
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }

    .card {
      flex-shrink: 0;
      width: 108px;
      height: 118px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      padding: 6px;
      transition: background 0.2s;
    }

    .card .ico {
      font-size: 26px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }
    .card .type-lbl {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .card .meta-lbl {
      font-size: 10px;
      color: #94a3b8;
      font-weight: 600;
    }

    /* Рамки редкости */
    .card.common { border-bottom: 3px solid var(--common); }
    .card.common .type-lbl { color: var(--common); }

    .card.rare { border-bottom: 3px solid var(--rare); background: rgba(56, 189, 248, 0.04); }
    .card.rare .type-lbl { color: var(--rare); }

    .card.epic { border-bottom: 3px solid var(--epic); background: rgba(192, 132, 252, 0.04); }
    .card.epic .type-lbl { color: var(--epic); }

    .card.legendary { 
      border-bottom: 3px solid var(--legendary); 
      background: radial-gradient(circle, rgba(251, 191, 36, 0.12), rgba(255, 255, 255, 0.01));
    }
    .card.legendary .type-lbl { color: var(--legendary); }

    /* Блок выпавшего дропа */
    .drop-display {
      width: 100%;
      max-width: 440px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      min-height: 200px;
      justify-content: center;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .drop-rarity {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #64748b;
    }

    .drop-title {
      font-size: 21px;
      font-weight: 900;
      color: #fff;
      line-height: 1.2;
    }

    .drop-desc {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.45;
      max-width: 340px;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 4px;
    }

    .spec-tag {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      color: #e2e8f0;
    }

    /* Кнопки */
    .action-panel {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-main {
      width: 100%;
      padding: 16px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.35);
      transition: transform 0.08s ease, opacity 0.15s ease;
    }

    .btn-main:active {
      transform: scale(0.97);
    }

    .btn-main:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-share {
      width: 100%;
      padding: 14px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.08s ease;
    }

    .btn-share:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <header>
    <div class="badge-top">
      <span class="dot"></span>
      <span>Студийная Сессия</span>
    </div>
    <h1>КЕЙС ПРОДЮСЕРА</h1>
  </header>

  <div class="roulette-wrap">
    <div class="marker"></div>
    <div class="tape" id="tape"></div>
  </div>

  <div class="drop-display" id="display">
    <div class="drop-rarity">Готов к прокрутке</div>
    <div class="drop-title">Что напишем сегодня? 🎧</div>
    <div class="drop-desc">Крути кейс, чтобы выбить случайный стиль, BPM и тональность для бита или лупа.</div>
  </div>

  <div class="action-panel">
    <button class="btn-main" id="spin-btn">Открыть кейс 📦</button>
    <button class="btn-share" id="share-btn">Скопировать ТЗ в буфер 📋</button>
  </div>

<script>
  // Интеграция Telegram
  const tg = window.Telegram?.WebApp;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      tg.headerColor = '#07090e';
      tg.backgroundColor = '#07090e';
    } catch(e) {}
  }

  function haptic(type = 'light') {
    try {
      if (tg?.HapticFeedback) {
        if (type === 'light') tg.HapticFeedback.impactOccurred('light');
        if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
        if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      }
    } catch(e) {}
  }

  // Web Audio без задержек
  class SoundManager {
    constructor() { this.ctx = null; }
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    }
    tick() {
      if (!this.ctx) return;
      try {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        g.gain.setValueAtTime(0.06, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.03);
      } catch(e) {}
    }
    fanfare() {
      if (!this.ctx) return;
      [523, 659, 784, 1046].forEach((f, i) => {
        setTimeout(() => {
          try {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, this.ctx.currentTime);
            g.gain.setValueAtTime(0.14, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.35);
          } catch(e) {}
        }, i * 90);
      });
    }
  }
  const sound = new SoundManager();

  // Пул задач
  const ITEMS = [
    { type: 'Луп', name: 'Dark Drill Melody', bpm: '144 BPM', key: 'C Minor', rarity: 'common', ico: '🎹', desc: 'Фортепиано с полутоновыми интервалами, реверсом и мрачным колокольчиком.', tags: ['Drill', 'Piano', 'Reverse'] },
    { type: 'Луп', name: 'Lo-Fi Винтаж Гармония', bpm: '85 BPM', key: 'F# Major', rarity: 'common', ico: '☕', desc: 'Тёплые Rhodes-клавиши, даунклок (Bitcrush) и легкий детюн для расслабленного трека.', tags: ['Rhodes', 'Tape Wobble', 'Chill'] },
    { type: 'Луп', name: '808 Glide Паттерн', bpm: '140 BPM', key: 'D Minor', rarity: 'common', ico: '🔊', desc: 'Пропиши агрессивную басовую линию с высокими октавными слайдами.', tags: ['808 Bass', 'Slide', 'Heavy'] },

    { type: 'Бит', name: 'Drift Phonk Banger', bpm: '140 BPM', key: 'A Minor', rarity: 'rare', ico: '🏎️', desc: 'Перегруженный Cowbell, грязные мемфис-акапеллы и раскатистый бас.', tags: ['Phonk', 'Cowbell', 'Distortion'] },
    { type: 'Бит', name: 'Trap Metal / Dark Trap', bpm: '135 BPM', key: 'E Minor', rarity: 'rare', ico: '🔥', desc: 'Быстрые хэты, резкий снейр и дисторшн-гитара под агрессивный флоу.', tags: ['Hard Trap', 'Guitar', 'Aggressive'] },
    { type: 'Луп', name: 'Hyperpop Synth Lead', bpm: '150 BPM', key: 'G Major', rarity: 'rare', ico: '🧪', desc: 'Яркие пилообразные волны с арпеджиатором и быстрым портаменто.', tags: ['Hyperpop', 'Saw Lead', 'Fast'] },

    { type: 'Бит', name: 'Rage Beat в стиле Yeat', bpm: '152 BPM', key: 'F Minor', rarity: 'epic', ico: '⚡', desc: 'Стена из жирных EDM-синтов, короткая бочка и плотный 808.', tags: ['Rage', 'EDM', 'Yeat Style'] },
    { type: 'Бит', name: 'Hardstyle / Speed Phonk', bpm: '160 BPM', key: 'G# Minor', rarity: 'epic', ico: '🔨', desc: 'Быстрый темп, ток-бочка (Tok kick) и реверсивный качающий саб-бас.', tags: ['Hardstyle', '160 BPM', 'Energy'] },

    { type: 'Бит', name: 'Эксклюзив Под Продажу', bpm: '142 BPM', key: 'B Minor', rarity: 'legendary', ico: '👑', desc: 'Собрать полноценную аранжировку: интро с голосовым тегом, 2 куплета, бридж и аутро.', tags: ['Exclusive', 'Full Track', 'Cash'] },
    { type: 'Челлендж', name: 'Бит из 1 Сэмпла за 20 мин', bpm: 'Свободный', key: 'Любой', rarity: 'legendary', ico: '⏱️', desc: 'Запиши звук со стола, нарежь его на бочку, снейр и хай-хэт и сделай трек.', tags: ['Challenge', 'Sound Design', 'Pro'] }
  ];

  const tapeEl = document.getElementById('tape');
  const spinBtn = document.getElementById('spin-btn');
  const shareBtn = document.getElementById('share-btn');
  const displayEl = document.getElementById('display');

  const CARD_WIDTH = 120; // 108px + 12px gap
  let isSpinning = false;
  let tapeData = [];
  let currentTaskText = '';

  function createTape() {
    tapeEl.innerHTML = '';
    tapeData = [];
    
    // Создаем 65 карточек для плавной прокрутки
    for (let i = 0; i < 65; i++) {
      const item = ITEMS[Math.floor(Math.random() * ITEMS.length)];
      tapeData.push(item);

      const card = document.createElement('div');
      card.className = `card ${item.rarity}`;
      card.innerHTML = `
        <div class="ico">${item.ico}</div>
        <div class="type-lbl">${item.type}</div>
        <div class="meta-lbl">${item.bpm}</div>
      `;
      tapeEl.appendChild(card);
    }
  }

  createTape();

  function startSpin() {
    if (isSpinning) return;
    isSpinning = true;
    spinBtn.disabled = true;
    shareBtn.style.display = 'none';
    sound.init();

    // Случайная победная карточка в диапазоне [48..56]
    const winIndex = 48 + Math.floor(Math.random() * 8);
    const winItem = tapeData[winIndex];

    // Смещение внутри карточки для естественности
    const microOffset = (Math.random() - 0.5) * 50;
    const rouletteWidth = document.querySelector('.roulette-wrap').offsetWidth;
    const targetX = (winIndex * CARD_WIDTH) + (CARD_WIDTH / 2) - (rouletteWidth / 2) + microOffset;

    // Сброс позиции
    tapeEl.style.transition = 'none';
    tapeEl.style.transform = 'translate3d(0, 0, 0)';

    // Плавный пуск анимации
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        tapeEl.style.transition = 'transform 4.8s cubic-bezier(0.12, 0.82, 0.18, 1)';
        tapeEl.style.transform = `translate3d(-${targetX}px, 0, 0)`;

        // Звуковые щелчки
        let step = 0;
        const totalSteps = 30;
        function playTick() {
          if (step >= totalSteps) return;
          sound.tick();
          haptic('light');
          step++;
          const nextDelay = 60 + Math.pow(step / totalSteps, 3.2) * 360;
          setTimeout(playTick, nextDelay);
        }
        playTick();
      });
    });

    // Финал прокрутки
    setTimeout(() => {
      isSpinning = false;
      spinBtn.disabled = false;
      spinBtn.innerText = 'Крутить снова 🎲';
      sound.fanfare();
      haptic('heavy');

      renderResult(winItem);
    }, 4900);
  }

  function renderResult(item) {
    const colorVar = `var(--${item.rarity})`;
    displayEl.style.borderColor = colorVar;
    displayEl.style.boxShadow = `0 12px 36px rgba(0, 0, 0, 0.4), 0 0 20px ${colorVar}33`;

    displayEl.innerHTML = `
      <div class="drop-rarity" style="color: ${colorVar}">★ ${item.rarity.toUpperCase()} ★</div>
      <div class="drop-title">${item.ico} ${item.name}</div>
      <div class="drop-desc">${item.desc}</div>
      <div class="tag-row">
        <span class="spec-tag">⚡ ${item.type}</span>
        <span class="spec-tag">⏱️ ${item.bpm}</span>
        <span class="spec-tag">🎵 ${item.key}</span>
        ${item.tags.map(t => `<span class="spec-tag">#${t}</span>`).join('')}
      </div>
    `;

    currentTaskText = `🎯 Моя задача на битмарь-сессию:\n${item.ico} ${item.name}\nФормат: ${item.type} | ${item.bpm} | Тональность: ${item.key}\nПодробности: ${item.desc}\nТеги: ${item.tags.join(', ')}`;
    shareBtn.style.display = 'flex';
  }

  spinBtn.addEventListener('click', startSpin);

  shareBtn.addEventListener('click', () => {
    if (!currentTaskText) return;
    navigator.clipboard.writeText(currentTaskText).then(() => {
      shareBtn.innerText = 'Скопировано в буфер! ✅';
      haptic('medium');
      setTimeout(() => {
        shareBtn.innerText = 'Скопировать ТЗ в буфер 📋';
      }, 1500);
    });
  });
</script>
</body>
</html>
