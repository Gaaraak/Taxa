<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chinchilla Parkour: Physics Simulation</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0e14;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: none;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-left: 16px;
      padding-right: 16px;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
    }

    .hud-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 8px 14px;
      color: #f1f5f9;
      font-size: 13px;
      font-weight: 600;
    }

    .stamina-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 120px;
    }
    .stamina-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      overflow: hidden;
    }
    .stamina-bar-fill {
      width: 100%;
      height: 100%;
      background: #10b981;
      border-radius: 3px;
      transition: width 0.1s linear, background-color 0.2s;
    }

    /* Мобильные виртуальные кнопки */
    #touch-panel {
      position: absolute;
      bottom: 24px;
      left: 0;
      width: 100%;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 10;
    }

    .ctrl-group {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .t-btn {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      transition: transform 0.08s, background 0.08s;
    }
    .t-btn span.label {
      font-size: 9px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .t-btn:active, .t-btn.active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.2);
    }

    .jump-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.3);
      border: 2px solid #60a5fa;
    }
  </style>
</head>
<body>

<div id="container">
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="hud-card stamina-container">
      <div style="display:flex; justify-content:space-between; font-size:11px;">
        <span>ВЫНОСЛИВОСТЬ</span>
        <span id="stamina-txt">100%</span>
      </div>
      <div class="stamina-bar-bg">
        <div class="stamina-bar-fill" id="stamina-bar"></div>
      </div>
    </div>

    <div class="hud-card" style="text-align: right;">
      <div style="font-size: 10px; color: #94a3b8; text-transform: uppercase;">Высота</div>
      <div id="height-val" style="font-size: 18px; font-weight: 800; color: #38bdf8;">0.0 м</div>
    </div>
  </div>

  <div id="touch-panel">
    <div class="ctrl-group">
      <div class="t-btn" id="btn-left">◀<span class="label">Влево</span></div>
      <div class="t-btn" id="btn-right">▶<span class="label">Вправо</span></div>
    </div>
    <div class="ctrl-group">
      <div class="t-btn" id="btn-crouch">▼<span class="label">Скат</span></div>
      <div class="t-btn jump-btn" id="btn-jump">▲<span class="label">Прыжок</span></div>
    </div>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      tg.headerColor = '#0b0e14';
    } catch(e) {}
  }

  function haptic(type = 'light') {
    try {
      if (tg?.HapticFeedback) {
        if (type === 'light') tg.HapticFeedback.impactOccurred('light');
        if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
        if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
      }
    } catch(e) {}
  }

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.resetTransform?.();
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  // Физические константы
  const GRAVITY = 1750;
  const AIR_RESIST = 0.992;
  const GROUND_FRICTION = 0.85;

  const player = {
    x: W / 2,
    y: H - 150,
    vx: 0,
    vy: 0,
    r: 16,
    facing: 1,

    // Состояния паркура
    isGrounded: false,
    isLedgeClimbing: false,
    isCrouching: false,
    stumbleTimer: 0, // Заминка при жестком падении без переката
    chargeTime: 0,   // Зарядка прыжка
    stamina: 100,

    // Анимационные параметры
    squash: 1,
    stretch: 1,
    tailAngle: 0,
    tailTargetAngle: 0,
    pawCycle: 0,

    reset() {
      this.x = W / 2;
      this.y = H - 150;
      this.vx = 0;
      this.vy = 0;
      this.stamina = 100;
      this.isLedgeClimbing = false;
      this.stumbleTimer = 0;
    }
  };

  const input = {
    left: false,
    right: false,
    crouch: false,
    jumpPressed: false,
    jumpHeld: false
  };

  let platforms = [];
  let particles = [];
  let cameraY = 0;
  let maxHeightScore = 0;

  function initWorld() {
    platforms = [];
    particles = [];
    cameraY = 0;
    maxHeightScore = 0;

    // Начальный пол
    platforms.push({ x: 0, y: H - 60, w: W, h: 60, type: 'concrete' });

    // Сложный реалистичный уровень: перепады высот, карнизы, кирпичные выступы
    let curY = H - 170;
    for (let i = 0; i < 24; i++) {
      const w = 80 + Math.random() * 80;
      const x = 30 + Math.random() * (W - 60 - w);
      platforms.push({
        x,
        y: curY,
        w,
        h: 18,
        type: Math.random() > 0.4 ? 'wood' : 'stone'
      });
      // Дистанция между платформами подобрана под честную физику толчка шиншиллы
      curY -= (75 + Math.random() * 50);
    }
  }

  // Управление (Клавиатура)
  window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.left = true;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') input.right = true;
    if (e.code === 'KeyS' || e.code === 'ArrowDown') input.crouch = true;
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      if (!input.jumpHeld) input.jumpPressed = true;
      input.jumpHeld = true;
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.left = false;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') input.right = false;
    if (e.code === 'KeyS' || e.code === 'ArrowDown') input.crouch = false;
    if (e.code === 'Space' || e.code === 'ArrowUp') input.jumpHeld = false;
  });

  // Мобильные кнопки
  function bindTouch(btn, onDown, onUp) {
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      onDown();
    }, { passive: false });
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (onUp) onUp();
    }, { passive: false });
  }

  bindTouch(document.getElementById('btn-left'), () => { input.left = true; }, () => { input.left = false; });
  bindTouch(document.getElementById('btn-right'), () => { input.right = true; }, () => { input.right = false; });
  bindTouch(document.getElementById('btn-crouch'), () => { input.crouch = true; }, () => { input.crouch = false; });
  bindTouch(document.getElementById('btn-jump'), () => {
    if (!input.jumpHeld) input.jumpPressed = true;
    input.jumpHeld = true;
  }, () => {
    input.jumpHeld = false;
  });

  function emitDust(x, y, count = 5) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 70,
        vy: -Math.random() * 40,
        life: 0.3 + Math.random() * 0.2,
        rad: 2 + Math.random() * 2
      });
    }
  }

  // Физический апдейт
  let lastTime = performance.now();

  function update(dt) {
    // Восстановление стамины
    if (player.isGrounded && !input.jumpHeld) {
      player.stamina = Math.min(100, player.stamina + 25 * dt);
    }

    // Заминка при жестком падении
    if (player.stumbleTimer > 0) {
      player.stumbleTimer -= dt;
      player.vx *= 0.7;
      return;
    }

    // Если карабкается на край (Ledge Climb)
    if (player.isLedgeClimbing) {
      player.vy = -180;
      player.vx = player.facing * 90;
      player.stamina -= 18 * dt;
      if (player.stamina <= 0 || player.vy > -10) {
        player.isLedgeClimbing = false;
      }
    }

    // Зарядка прыжка шиншиллы (приседание перед толчком задними лапами)
    if (player.isGrounded && input.jumpHeld && player.stamina > 15) {
      player.chargeTime = Math.min(player.chargeTime + dt * 2.8, 1.0);
      player.squash = 1.35;
      player.stretch = 0.7;
      player.vx *= 0.6; // при подготовке к прыжку зверек замирает
    } else if (player.chargeTime > 0) {
      // Совершение прыжка
      const jumpPower = 400 + player.chargeTime * 420;
      player.vy = -jumpPower;
      player.vx += player.facing * (120 * player.chargeTime);
      player.isGrounded = false;
      player.squash = 0.65;
      player.stretch = 1.45;
      player.stamina -= 12 + player.chargeTime * 15;
      player.chargeTime = 0;
      haptic('light');
      emitDust(player.x, player.y + player.r, 8);
    }

    // Движение по горизонтали с реалистичным разгоном
    const accel = player.isGrounded ? 1100 : 420;
    if (input.left && !player.isLedgeClimbing) {
      player.vx -= accel * dt;
      player.facing = -1;
    } else if (input.right && !player.isLedgeClimbing) {
      player.vx += accel * dt;
      player.facing = 1;
    } else if (player.isGrounded) {
      player.vx *= GROUND_FRICTION;
    } else {
      player.vx *= AIR_RESIST;
    }

    // Ограничение максимальной скорости бега
    const maxSpeed = 320;
    if (Math.abs(player.vx) > maxSpeed) {
      player.vx = Math.sign(player.vx) * maxSpeed;
    }

    // Гравитация
    if (!player.isLedgeClimbing) {
      player.vy += GRAVITY * dt;
    }

    // Перемещение
    player.x += player.vx * dt;
    player.y += player.vy * dt;

    // Анимация лапок и хвоста
    if (player.isGrounded && Math.abs(player.vx) > 20) {
      player.pawCycle += dt * 18;
    }
    // Хвост служит балансиром при прыжке
    player.tailTargetAngle = (player.vy * 0.0015) - (player.vx * 0.001);
    player.tailAngle += (player.tailTargetAngle - player.tailAngle) * 10 * dt;

    // Плавное возвращение формы
    player.squash += (1 - player.squash) * 9 * dt;
    player.stretch += (1 - player.stretch) * 9 * dt;

    // Границы экрана с отскоком (Wall Tic-Tac / Wall-Jump)
    if (player.x - player.r < 10) {
      player.x = 10 + player.r;
      if (!player.isGrounded && input.jumpPressed && player.stamina > 10) {
        // Отталкивание от стены лапками
        player.vx = 290;
        player.vy = -490;
        player.facing = 1;
        player.stamina -= 10;
        player.stretch = 1.3;
        haptic('medium');
        emitDust(player.x, player.y, 6);
      } else {
        player.vx = 0;
      }
    } else if (player.x + player.r > W - 10) {
      player.x = W - 10 - player.r;
      if (!player.isGrounded && input.jumpPressed && player.stamina > 10) {
        player.vx = -290;
        player.vy = -490;
        player.facing = -1;
        player.stamina -= 10;
        player.stretch = 1.3;
        haptic('medium');
        emitDust(player.x, player.y, 6);
      } else {
        player.vx = 0;
      }
    }
    input.jumpPressed = false;

    // Коллизии с платформами
    const wasGrounded = player.isGrounded;
    player.isGrounded = false;
    player.isLedgeClimbing = false;

    for (const p of platforms) {
      // Приземление сверху
      if (
        player.vy >= 0 &&
        player.x + player.r * 0.6 > p.x &&
        player.x - player.r * 0.6 < p.x + p.w &&
        player.y + player.r >= p.y &&
        player.y + player.r <= p.y + p.h + 10
      ) {
        // Проверка жесткости приземления
        const impactVel = player.vy;
        player.y = p.y - player.r;
        player.vy = 0;
        player.isGrounded = true;

        if (impactVel > 780) {
          // Если зажат скат/присед — совершается мягкий ролл (паркур-перекат)
          if (input.crouch) {
            player.vx = player.facing * 260;
            player.squash = 1.4;
            haptic('light');
          } else {
            // Иначе — жесткое падение с временной заминкой (stumble)
            player.stumbleTimer = 0.45;
            player.squash = 1.6;
            player.stretch = 0.5;
            haptic('heavy');
          }
          emitDust(player.x, player.y + player.r, 10);
        } else if (!wasGrounded) {
          player.squash = 1.25;
          player.stretch = 0.8;
          emitDust(player.x, player.y + player.r, 4);
        }
        break;
      }

      // Хват за край платформы (Ledge Grab), если шиншилла задела угол передними лапками
      if (!player.isGrounded && player.vy > -50 && player.vy < 350) {
        const leftLedge = Math.abs((player.x + player.r) - p.x) < 8 && Math.abs(player.y - p.y) < 12;
        const rightLedge = Math.abs((player.x - player.r) - (p.x + p.w)) < 8 && Math.abs(player.y - p.y) < 12;

        if (leftLedge || rightLedge) {
          player.isLedgeClimbing = true;
          player.facing = leftLedge ? 1 : -1;
          break;
        }
      }
    }

    // Камера с кинематографическим весом
    const targetCamY = player.y - H * 0.6;
    cameraY += (targetCamY - cameraY) * 5 * dt;

    // Подсчет высоты
    const hMeters = Math.max(0, (H - 150 - player.y) / 45);
    if (hMeters > maxHeightScore) maxHeightScore = hMeters;

    // Обновление интерфейса
    document.getElementById('height-val').innerText = `${maxHeightScore.toFixed(1)} м`;
    const staminaEl = document.getElementById('stamina-bar');
    staminaEl.style.width = `${Math.max(0, player.stamina)}%`;
    staminaEl.style.backgroundColor = player.stamina < 25 ? '#ef4444' : '#10b981';
    document.getElementById('stamina-txt').innerText = `${Math.round(player.stamina)}%`;

    // Спавн платформ выше по мере подъема
    const topPlat = platforms[platforms.length - 1];
    if (topPlat && topPlat.y > cameraY - 300) {
      const w = 75 + Math.random() * 85;
      const x = 30 + Math.random() * (W - 60 - w);
      platforms.push({
        x,
        y: topPlat.y - (80 + Math.random() * 50),
        w,
        h: 18,
        type: Math.random() > 0.4 ? 'wood' : 'stone'
      });
    }

    // Очистка старых платформ внизу
    if (platforms.length > 35) {
      platforms = platforms.filter(p => p.y < cameraY + H + 200);
    }

    // Если сорвался вниз
    if (player.y > cameraY + H + 120) {
      player.reset();
      initWorld();
    }

    // Частицы
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // Отрисовка анатомически правдоподобной шиншиллы
  function drawChinchilla(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(player.facing * player.squash, player.stretch);

    // Угол наклона тела при разгоне
    const lean = (player.vx * 0.001) * player.facing;
    ctx.rotate(lean);

    // Хвост-противовес (многосегментный вид)
    ctx.save();
    ctx.translate(-player.r * 0.7, player.r * 0.1);
    ctx.rotate(-player.tailAngle);
    ctx.beginPath();
    ctx.ellipse(-14, -4, 16, 8, -0.2, 0, Math.PI * 2);
    ctx.fillStyle = '#64748b';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-24, -8, 12, 6, -0.4, 0, Math.PI * 2);
    ctx.fillStyle = '#475569';
    ctx.fill();
    ctx.restore();

    // Задняя лапка (толчковая, мощная)
    ctx.beginPath();
    ctx.ellipse(-player.r * 0.2, player.r * 0.65, 8, 5, 0.2, 0, Math.PI * 2);
    ctx.fillStyle = '#e2e8f0';
    ctx.fill();

    // Тело с плотным мехом
    ctx.beginPath();
    ctx.ellipse(0, 0, player.r * 1.1, player.r * 0.95, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#94a3b8';
    ctx.fill();

    // Пушистый подшерсток на грудке
    ctx.beginPath();
    ctx.ellipse(player.r * 0.35, player.r * 0.15, player.r * 0.6, player.r * 0.65, 0.1, 0, Math.PI * 2);
    ctx.fillStyle = '#f8fafc';
    ctx.fill();

    // Передние цепкие лапки
    ctx.beginPath();
    const pawShift = Math.sin(player.pawCycle) * 3;
    ctx.ellipse(player.r * 0.5 + pawShift, player.r * 0.55, 4, 3, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#fbcfe8';
    ctx.fill();

    // Уши шиншиллы (тонкие, чувствительные к ветру)
    ctx.beginPath();
    ctx.ellipse(-player.r * 0.3, -player.r * 0.9, 6, 12, -0.25, 0, Math.PI * 2);
    ctx.fillStyle = '#64748b';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-player.r * 0.3, -player.r * 0.9, 3.5, 8, -0.25, 0, Math.PI * 2);
    ctx.fillStyle = '#fda4af';
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(player.r * 0.25, -player.r * 0.9, 6, 12, 0.2, 0, Math.PI * 2);
    ctx.fillStyle = '#64748b';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(player.r * 0.25, -player.r * 0.9, 3.5, 8, 0.2, 0, Math.PI * 2);
    ctx.fillStyle = '#fda4af';
    ctx.fill();

    // Глаз (крупный, ночной)
    ctx.beginPath();
    ctx.arc(player.r * 0.45, -player.r * 0.15, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = '#090d16';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(player.r * 0.48, -player.r * 0.18, 1.2, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    // Носик и вибриссы (усы для координации в прыжке)
    ctx.beginPath();
    ctx.arc(player.r * 0.88, 0, 2, 0, Math.PI * 2);
    ctx.fillStyle = '#fb7185';
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(player.r * 0.8, -1); ctx.lineTo(player.r * 1.4, -4);
    ctx.moveTo(player.r * 0.8, 1);  ctx.lineTo(player.r * 1.5, 2);
    ctx.moveTo(player.r * 0.8, 3);  ctx.lineTo(player.r * 1.35, 7);
    ctx.stroke();

    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    // Архитектурный фон
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#090d14');
    bg.addColorStop(1, '#1e293b');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(0, -cameraY);

    // Платформы с деталями фактуры
    for (const p of platforms) {
      if (p.type === 'wood') {
        ctx.fillStyle = '#78350f';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#b45309';
        ctx.fillRect(p.x, p.y, p.w, 3); // верхняя кромка
      } else {
        ctx.fillStyle = '#334155';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#64748b';
        ctx.fillRect(p.x, p.y, p.w, 3);
      }
      // Фаска карниза
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(p.x, p.y + p.h - 3, p.w, 3);
    }

    // Частицы пыли при толчках
    for (const pt of particles) {
      ctx.fillStyle = `rgba(203, 213, 225, ${pt.life})`;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.rad, 0, Math.PI * 2);
      ctx.fill();
    }

    // Шиншилла
    drawChinchilla(player.x, player.y);

    ctx.restore();
  }

  function frame(now) {
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.033) dt = 0.033;

    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  initWorld();
  requestAnimationFrame(frame);
</script>
</body>
</html>
