<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Такса-Раннер PRO Realistic</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0d17;
      --card: #151828;
      --accent: #f59e0b;
      --btn: #ef4444;
      --bonus: #10b981;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      overflow: hidden;
      touch-action: manipulation;
    }

    header {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
    }

    .badge {
      background: var(--card);
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 420px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      border: 2px solid #282c40;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 17, 26, 0.88);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 10;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h2 {
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(245, 158, 11, 0.4);
    }

    .overlay p {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .btn {
      background: var(--btn);
      color: #fff;
      font-size: 1.15rem;
      font-weight: 800;
      padding: 14px 34px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
      transition: transform 0.1s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .controls-hint {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">🌭 Длина: <span id="length-val" style="color: var(--accent);">1</span> м</div>
    <div class="badge">Время: <span id="time-val">☀️ День</span></div>
    <div class="badge">🏆 Рекорд: <span id="best-val">0</span> м</div>
  </header>

  <div id="game-container">
    <canvas id="canvas" width="440" height="420"></canvas>

    <div class="overlay" id="overlay">
      <h2 id="overlay-title">🐶 Такса-Раннер REAL</h2>
      <p id="overlay-desc">
        • Тапай для прыжка (есть <b>двойной прыжок</b>!)<br>
        • Лови настоящие сочные сосиски гриль 🌭<br>
        • Уворачивайся от пикирующего орла 🦅 и котов 🐱!
      </p>
      <button class="btn" id="start-btn" onclick="startGame()">В ИГРУ</button>
    </div>
  </div>

  <div class="controls-hint">Двойной тап в воздухе = двойной прыжок!</div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function haptic(type) {
      if (!tg?.HapticFeedback) return;
      if (type === 'impact') tg.HapticFeedback.impactOccurred('medium');
      if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
      if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
    }

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function soundJump(isDouble = false) {
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(isDouble ? 480 : 320, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(isDouble ? 700 : 520, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch(e){}
    }

    function soundEat(isBone = false) {
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = isBone ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(isBone ? 600 : 540, audioCtx.currentTime);
        osc.frequency.setValueAtTime(isBone ? 900 : 720, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.18);
      } catch(e){}
    }

    function soundHit() {
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(90, audioCtx.currentTime + 0.28);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.28);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.28);
      } catch(e){}
    }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const lengthVal = document.getElementById('length-val');
    const timeVal = document.getElementById('time-val');
    const bestVal = document.getElementById('best-val');

    let bestScore = parseInt(localStorage.getItem('taxa_runner_best') || '1');
    bestVal.textContent = bestScore;

    const taxaImg = new Image();
    taxaImg.src = 'taxa.jpg';

    let isPlaying = false;
    let frame = 0;
    const groundY = 345;
    let speed = 4.2;
    let bonesCollected = 0;
    let shieldTimer = 0;

    const DAY_CYCLE_FRAMES = 1200;

    const taxa = {
      x: 80,
      y: groundY - 32,
      baseW: 36,
      segmentLen: 12,
      segments: 2,
      h: 28,
      vy: 0,
      gravity: 0.72,
      jumpForce: -11.5,
      jumpsLeft: 2
    };

    let items = [];
    let particles = [];
    let clouds = [
      { x: 30, y: 40, s: 0.5 },
      { x: 220, y: 65, s: 0.7 },
      { x: 380, y: 35, s: 0.4 }
    ];

    let stars = [];
    for (let i = 0; i < 35; i++) {
      stars.push({
        x: Math.random() * 440,
        y: Math.random() * (groundY - 80),
        size: 1 + Math.random() * 2,
        twinkleOffset: Math.random() * Math.PI * 2
      });
    }

    function createDust(x, y) {
      for (let i = 0; i < 3; i++) {
        particles.push({
          x: x + Math.random() * 8,
          y: y + Math.random() * 4,
          vx: -(speed * 0.4) - Math.random() * 1.5,
          vy: -Math.random() * 1.2,
          alpha: 0.7,
          size: 3 + Math.random() * 3
        });
      }
    }

    function resetGame() {
      taxa.y = groundY - taxa.h;
      taxa.vy = 0;
      taxa.segments = 2;
      taxa.jumpsLeft = 2;
      speed = 4.2;
      bonesCollected = 0;
      shieldTimer = 0;
      items = [];
      particles = [];
      frame = 0;
      updateUI();
    }

    function updateUI() {
      const curLen = Math.floor(taxa.segments * 0.5);
      lengthVal.textContent = curLen;
      if (curLen > bestScore) {
        bestScore = curLen;
        localStorage.setItem('taxa_runner_best', bestScore);
        bestVal.textContent = bestScore;
      }
    }

    function handleJump() {
      if (!isPlaying) return;
      initAudio();

      if (taxa.jumpsLeft > 0) {
        const isDouble = (taxa.jumpsLeft === 1);
        taxa.vy = isDouble ? taxa.jumpForce * 0.95 : taxa.jumpForce;
        taxa.jumpsLeft--;
        soundJump(isDouble);
        haptic(isDouble ? 'heavy' : 'impact');
        createDust(taxa.x - (taxa.segments * taxa.segmentLen), groundY);
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      handleJump();
    });

    function spawnItems() {
      // 1. Сосиски
      if (frame % 80 === 0) {
        items.push({
          type: 'sausage',
          x: canvas.width + 20,
          y: groundY - 32 - Math.random() * 65,
          w: 36,
          h: 18
        });
      }

      // 2. Косточка щита
      if (frame % 380 === 0 && Math.random() > 0.4) {
        items.push({
          type: 'bone',
          x: canvas.width + 30,
          y: groundY - 70 - Math.random() * 40,
          w: 26,
          h: 16
        });
      }

      // 3. Препятствия
      if (frame % 140 === 0 && frame > 60) {
        const rand = Math.random();
        if (rand < 0.4) {
          items.push({ type: 'log', x: canvas.width + 30, y: groundY - 26, w: 32, h: 26 });
        } else if (rand < 0.72) {
          items.push({ type: 'cat', x: canvas.width + 30, y: groundY - 32, w: 30, h: 32 });
        } else {
          // Орёл в воздухе с собственной анимацией покачивания
          items.push({ 
            type: 'eagle', 
            x: canvas.width + 40, 
            y: groundY - 95 - Math.random() * 30, 
            w: 48, 
            h: 30,
            baseY: groundY - 95 - Math.random() * 30
          });
        }
      }
    }

    function gameOver() {
      isPlaying = false;
      soundHit();
      haptic('error');

      overlayTitle.textContent = 'Ой! Столкновение 💥';
      overlayDesc.innerHTML = `Твоя такса выросла до <b>${Math.floor(taxa.segments * 0.5)} м</b>!<br>Косточек собрано: <b>${bonesCollected}</b> 🦴`;
      document.getElementById('start-btn').textContent = 'ЕЩЁ РАЗ';
      overlay.classList.remove('hidden');
    }

    function update() {
      if (!isPlaying) return;
      frame++;

      if (shieldTimer > 0) shieldTimer--;

      const cycleProg = (frame % DAY_CYCLE_FRAMES) / DAY_CYCLE_FRAMES;
      const isNight = cycleProg > 0.45 && cycleProg < 0.95;
      timeVal.textContent = isNight ? '🌙 Ночь' : '☀️ День';

      taxa.vy += taxa.gravity;
      taxa.y += taxa.vy;

      if (taxa.y >= groundY - taxa.h) {
        taxa.y = groundY - taxa.h;
        taxa.vy = 0;
        taxa.jumpsLeft = 2;
        if (frame % 6 === 0) {
          createDust(taxa.x - (taxa.segments * taxa.segmentLen) + 10, groundY - 2);
        }
      }

      clouds.forEach(c => {
        c.x -= c.s * 0.8;
        if (c.x < -60) c.x = canvas.width + 40;
      });

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.025;
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      spawnItems();

      for (let i = items.length - 1; i >= 0; i--) {
        const obj = items[i];
        obj.x -= speed;

        if (obj.type === 'eagle') {
          obj.y = obj.baseY + Math.sin(frame * 0.08) * 12;
        }

        const taxaTailX = taxa.x - (taxa.segments * taxa.segmentLen);

        if (obj.type === 'sausage') {
          if (
            taxa.x + taxa.baseW > obj.x &&
            taxaTailX < obj.x + obj.w &&
            taxa.y + taxa.h > obj.y &&
            taxa.y < obj.y + obj.h
          ) {
            taxa.segments++;
            speed = Math.min(9.0, 4.2 + taxa.segments * 0.12);
            soundEat(false);
            haptic('impact');
            items.splice(i, 1);
            updateUI();
            continue;
          }
        }

        if (obj.type === 'bone') {
          if (
            taxa.x + taxa.baseW > obj.x &&
            taxaTailX < obj.x + obj.w &&
            taxa.y + taxa.h > obj.y &&
            taxa.y < obj.y + obj.h
          ) {
            bonesCollected++;
            shieldTimer = 300;
            soundEat(true);
            haptic('success');
            items.splice(i, 1);
            updateUI();
            continue;
          }
        }

        if (obj.type === 'log' || obj.type === 'cat' || obj.type === 'eagle') {
          const hitHeadX = taxa.x + 8;
          if (
            hitHeadX + 24 > obj.x + 4 &&
            hitHeadX < obj.x + obj.w - 4 &&
            taxa.y + taxa.h > obj.y + 4 &&
            taxa.y < obj.y + obj.h - 4
          ) {
            if (shieldTimer > 0) {
              shieldTimer = 0;
              soundHit();
              haptic('heavy');
              items.splice(i, 1);
              continue;
            } else {
              gameOver();
              return;
            }
          }
        }

        if (obj.x < -70) items.splice(i, 1);
      }
    }

    function interpolateColor(color1, color2, factor) {
      const result = color1.slice();
      for (let i = 0; i < 3; i++) {
        result[i] = Math.round(result[i] + factor * (color2[i] - color1[i]));
      }
      return `rgb(${result[0]}, ${result[1]}, ${result[2]})`;
    }

    // --- РЕАЛИСТИЧНАЯ ОТРИСОВКА ОБЪЕКТОВ ---

    function drawRealisticSausage(x, y, w, h) {
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2);
      ctx.rotate(-0.08);

      // Тело сосиски с градиентом жарки
      const grad = ctx.createLinearGradient(0, -h/2, 0, h/2);
      grad.addColorStop(0, '#c0392b');
      grad.addColorStop(0.3, '#d35400');
      grad.addColorStop(0.7, '#a93226');
      grad.addColorStop(1, '#78281f');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(-w/2, -h/2, w, h, 8);
      ctx.fill();

      // Блик сочности сверху
      ctx.strokeStyle = 'rgba(255, 230, 200, 0.45)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.roundRect(-w/2 + 4, -h/2 + 2, w - 8, 3, 2);
      ctx.stroke();

      // Поперечные насечки от гриля
      ctx.strokeStyle = '#4a1712';
      ctx.lineWidth = 2;
      for (let offset = -w/3; offset <= w/3; offset += 9) {
        ctx.beginPath();
        ctx.moveTo(offset, -h/2 + 3);
        ctx.lineTo(offset + 3, h/2 - 3);
        ctx.stroke();
      }

      // Хвостики оболочки по краям
      ctx.fillStyle = '#641e16';
      ctx.beginPath();
      ctx.arc(-w/2 - 1, 0, 2.5, 0, Math.PI * 2);
      ctx.arc(w/2 + 1, 0, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawRealisticBone(x, y, w, h) {
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2);
      const bGrad = ctx.createLinearGradient(0, -h/2, 0, h/2);
      bGrad.addColorStop(0, '#fffdf7');
      bGrad.addColorStop(0.5, '#f6e58d');
      bGrad.addColorStop(1, '#dff9fb');

      ctx.fillStyle = bGrad;
      ctx.beginPath();
      ctx.roundRect(-w/2 + 4, -3, w - 8, 6, 3);
      ctx.fill();

      // Шарообразные суставы по краям
      ctx.beginPath();
      ctx.arc(-w/2 + 4, -4, 4.5, 0, Math.PI * 2);
      ctx.arc(-w/2 + 4, 4, 4.5, 0, Math.PI * 2);
      ctx.arc(w/2 - 4, -4, 4.5, 0, Math.PI * 2);
      ctx.arc(w/2 - 4, 4, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawRealisticLog(x, y, w, h) {
      ctx.save();
      // Кора бревна
      const barkGrad = ctx.createLinearGradient(x, y, x, y + h);
      barkGrad.addColorStop(0, '#5c4033');
      barkGrad.addColorStop(0.5, '#3e2723');
      barkGrad.addColorStop(1, '#2c1810');
      ctx.fillStyle = barkGrad;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 6);
      ctx.fill();

      // Боковой срез дерева
      ctx.fillStyle = '#d7ccc8';
      ctx.beginPath();
      ctx.ellipse(x + 5, y + h/2, 5, h/2 - 2, 0, 0, Math.PI * 2);
      ctx.fill();

      // Годичные кольца на спиле
      ctx.strokeStyle = '#8d6e63';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(x + 5, y + h/2, 3, h/4, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Борозды на коре
      ctx.strokeStyle = '#271711';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x + 12, y + 4);
      ctx.lineTo(x + w - 4, y + 5);
      ctx.moveTo(x + 10, y + h - 5);
      ctx.lineTo(x + w - 6, y + h - 4);
      ctx.stroke();
      ctx.restore();
    }

    function drawRealisticCat(x, y, w, h) {
      ctx.save();
      // Туловище присевшего кота
      const catGrad = ctx.createLinearGradient(x, y, x, y + h);
      catGrad.addColorStop(0, '#555');
      catGrad.addColorStop(0.5, '#333');
      catGrad.addColorStop(1, '#1a1a1a');
      ctx.fillStyle = catGrad;

      // Тело
      ctx.beginPath();
      ctx.ellipse(x + w/2 + 2, y + h - 10, 12, 10, -0.2, 0, Math.PI * 2);
      ctx.fill();

      // Голова
      ctx.beginPath();
      ctx.arc(x + 10, y + 10, 9, 0, Math.PI * 2);
      ctx.fill();

      // Ушки
      ctx.beginPath();
      ctx.moveTo(x + 3, y + 6);
      ctx.lineTo(x + 7, y - 2);
      ctx.lineTo(x + 11, y + 4);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(x + 10, y + 4);
      ctx.lineTo(x + 14, y - 2);
      ctx.lineTo(x + 17, y + 6);
      ctx.fill();

      // Глаза кота
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath();
      ctx.ellipse(x + 6, y + 10, 2.5, 1.8, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 12, y + 10, 2.5, 1.8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.fillRect(x + 5.5, y + 9, 1, 2.5);
      ctx.fillRect(x + 11.5, y + 9, 1, 2.5);

      // Хвост трубой с изгибом
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x + w - 2, y + h - 8);
      ctx.quadraticCurveTo(x + w + 8, y + 8, x + w - 2, y + 4);
      ctx.stroke();

      ctx.restore();
    }

    function drawRealisticEagle(x, y, w, h) {
      ctx.save();
      const wingFlap = Math.sin(frame * 0.28) * 12; // анимация маха крыльев

      // 1. Хвост с белыми перьями
      ctx.fillStyle = '#f5f6fa';
      ctx.beginPath();
      ctx.moveTo(x + w - 4, y + 10);
      ctx.lineTo(x + w + 8, y + 6);
      ctx.lineTo(x + w + 8, y + 14);
      ctx.closePath();
      ctx.fill();

      // 2. Крыло дальнее (верхний мах)
      ctx.fillStyle = '#3a271d';
      ctx.beginPath();
      ctx.moveTo(x + 18, y + 6);
      ctx.quadraticCurveTo(x + 24, y - 16 + wingFlap, x + 38, y - 22 + wingFlap);
      ctx.lineTo(x + 28, y + 8);
      ctx.closePath();
      ctx.fill();

      // 3. Туловище тёмно-коричневое
      const bodyGrad = ctx.createLinearGradient(x + 8, y, x + 30, y + 14);
      bodyGrad.addColorStop(0, '#4a3325');
      bodyGrad.addColorStop(1, '#2b1d15');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.ellipse(x + 22, y + 10, 15, 7, -0.15, 0, Math.PI * 2);
      ctx.fill();

      // 4. Белая голова орла
      ctx.fillStyle = '#f8f9fa';
      ctx.beginPath();
      ctx.ellipse(x + 8, y + 7, 7, 6, -0.1, 0, Math.PI * 2);
      ctx.fill();

      // 5. Острый желтый хищный клюв
      ctx.fillStyle = '#f39c12';
      ctx.beginPath();
      ctx.moveTo(x + 3, y + 4);
      ctx.lineTo(x - 5, y + 7);
      ctx.quadraticCurveTo(x - 2, y + 11, x + 3, y + 10);
      ctx.closePath();
      ctx.fill();

      // Глаз орла
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(x + 6, y + 6, 1.2, 0, Math.PI * 2);
      ctx.fill();

      // 6. Крыло ближнее (переднее, мощное оперение)
      const wingGrad = ctx.createLinearGradient(x + 10, y + 8, x + 24, y - 18 + wingFlap);
      wingGrad.addColorStop(0, '#2b1d15');
      wingGrad.addColorStop(0.6, '#4a3325');
      wingGrad.addColorStop(1, '#1b120d');
      ctx.fillStyle = wingGrad;

      ctx.beginPath();
      ctx.moveTo(x + 12, y + 10);
      ctx.quadraticCurveTo(x + 18, y - 18 + wingFlap, x + 32, y - 26 + wingFlap);
      ctx.lineTo(x + 38, y - 18 + wingFlap);
      ctx.lineTo(x + 26, y + 12);
      ctx.closePath();
      ctx.fill();

      // Перья на кончиках крыла
      ctx.strokeStyle = '#1b120d';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x + 32, y - 26 + wingFlap);
      ctx.lineTo(x + 36, y - 30 + wingFlap);
      ctx.moveTo(x + 35, y - 22 + wingFlap);
      ctx.lineTo(x + 40, y - 25 + wingFlap);
      ctx.stroke();

      ctx.restore();
    }

    function drawRealisticDachshund(taxa, groundY) {
      const bodyY = taxa.y + 4;
      const bodyH = 20;
      const totalBodyLen = taxa.segments * taxa.segmentLen;
      const legRun = Math.sin(frame * 0.42) * 6;

      ctx.save();

      // Щит
      if (shieldTimer > 0) {
        ctx.strokeStyle = `rgba(16, 185, 129, ${0.45 + Math.sin(frame * 0.2) * 0.35})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.roundRect(taxa.x - totalBodyLen - 12, bodyY - 12, totalBodyLen + 48, bodyH + 30, 18);
        ctx.stroke();
      }

      // Хвост таксы (тонкий, слегка изогнутый кверху)
      ctx.strokeStyle = '#1d120c';
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(taxa.x - totalBodyLen + 2, bodyY + 6);
      ctx.quadraticCurveTo(taxa.x - totalBodyLen - 8, bodyY - 2 + Math.sin(frame * 0.35) * 4, taxa.x - totalBodyLen - 12, bodyY - 6 + Math.sin(frame * 0.35) * 3);
      ctx.stroke();

      // Задние анатомические лапки (с рыжими подпалинами на пальцах)
      ctx.strokeStyle = '#1f130b';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(taxa.x - totalBodyLen + 6, bodyY + bodyH - 2);
      ctx.lineTo(taxa.x - totalBodyLen + 6 - (taxa.vy === 0 ? legRun : 3), bodyY + bodyH + 9);
      ctx.stroke();

      // Рыжие коготки/носочки задних лап
      ctx.strokeStyle = '#a65b29';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(taxa.x - totalBodyLen + 6 - (taxa.vy === 0 ? legRun : 3), bodyY + bodyH + 7);
      ctx.lineTo(taxa.x - totalBodyLen + 8 - (taxa.vy === 0 ? legRun : 3), bodyY + bodyH + 9);
      ctx.stroke();

      // ДЛИННОЕ ТЕЛО ТАКСЫ (чёрно-подпалый гладкий окрас)
      const bodyGrad = ctx.createLinearGradient(0, bodyY, 0, bodyY + bodyH);
      bodyGrad.addColorStop(0, '#2d1c14'); // Тёмная спинка
      bodyGrad.addColorStop(0.4, '#1b110b'); // Чёрный перелив
      bodyGrad.addColorStop(0.85, '#22140d');
      bodyGrad.addColorStop(1, '#a65b29'); // Рыжеватый тёплый животик

      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.roundRect(taxa.x - totalBodyLen, bodyY, totalBodyLen + 18, bodyH, 10);
      ctx.fill();

      // Передние анатомические лапки
      ctx.strokeStyle = '#1f130b';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(taxa.x + 10, bodyY + bodyH - 2);
      ctx.lineTo(taxa.x + 10 + (taxa.vy === 0 ? legRun : -2), bodyY + bodyH + 9);
      ctx.stroke();

      // Рыжие носочки передних лап
      ctx.strokeStyle = '#a65b29';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(taxa.x + 10 + (taxa.vy === 0 ? legRun : -2), bodyY + bodyH + 7);
      ctx.lineTo(taxa.x + 13 + (taxa.vy === 0 ? legRun : -2), bodyY + bodyH + 9);
      ctx.stroke();

      // Реалистичный кожаный ошейник
      ctx.fillStyle = '#b71515';
      ctx.fillRect(taxa.x + 12, bodyY + 1, 6, bodyH - 3);
      ctx.fillStyle = '#f1c40f'; // Медальон
      ctx.beginPath();
      ctx.arc(taxa.x + 15, bodyY + bodyH - 1, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Голова: фото таксы пользователя (с идеальной посадкой)
      const headX = taxa.x + 14;
      const headY = taxa.y - 7;
      const headSize = 35;

      if (taxaImg.complete && taxaImg.naturalWidth !== 0) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(headX + headSize/2, headY + headSize/2, headSize/2, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(taxaImg, headX, headY, headSize, headSize);
        ctx.restore();

        // Тонкая естественная окантовка мордочки
        ctx.strokeStyle = '#a65b29';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(headX + headSize/2, headY + headSize/2, headSize/2, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        // Запасная реалистичная мордочка, если фото ещё не загрузилось
        ctx.fillStyle = '#1c120c';
        ctx.beginPath();
        ctx.ellipse(headX + 16, headY + 16, 14, 10, 0.1, 0, Math.PI * 2);
        ctx.fill();
        // Носик
        ctx.fillStyle = '#a65b29';
        ctx.beginPath();
        ctx.ellipse(headX + 26, headY + 18, 6, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(headX + 29, headY + 17, 2.5, 0, Math.PI * 2);
        ctx.fill();
        // Ушко
        ctx.fillStyle = '#140c07';
        ctx.beginPath();
        ctx.ellipse(headX + 10, headY + 18, 5, 10, 0.35, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // ДЕНЬ / НОЧЬ
      const cycle = (frame % DAY_CYCLE_FRAMES) / DAY_CYCLE_FRAMES;
      const nightFactor = Math.sin(cycle * Math.PI);

      const dayTop = [70, 140, 240];
      const dayBottom = [170, 215, 255];
      const nightTop = [8, 12, 30];
      const nightBottom = [24, 32, 60];

      const curSkyTop = interpolateColor(dayTop, nightTop, nightFactor);
      const curSkyBottom = interpolateColor(dayBottom, nightBottom, nightFactor);

      const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
      skyGrad.addColorStop(0, curSkyTop);
      skyGrad.addColorStop(1, curSkyBottom);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, groundY);

      if (nightFactor > 0.25) {
        const starAlpha = Math.min(1, (nightFactor - 0.25) * 1.5);
        stars.forEach(st => {
          const twinkle = 0.5 + 0.5 * Math.sin(frame * 0.08 + st.twinkleOffset);
          ctx.fillStyle = `rgba(255, 255, 255, ${starAlpha * twinkle})`;
          ctx.beginPath();
          ctx.arc(st.x, st.y, st.size, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      const celestialAngle = cycle * Math.PI * 2 - Math.PI / 2;
      const celestialRadius = 150;
      const centerX = canvas.width / 2;
      const centerY = groundY - 40;

      const sunX = centerX + Math.cos(celestialAngle) * celestialRadius;
      const sunY = centerY + Math.sin(celestialAngle) * 90;
      if (sunY < groundY + 20) {
        ctx.fillStyle = '#f59e0b';
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(sunX, sunY, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      const moonX = centerX + Math.cos(celestialAngle + Math.PI) * celestialRadius;
      const moonY = centerY + Math.sin(celestialAngle + Math.PI) * 90;
      if (moonY < groundY + 20) {
        ctx.fillStyle = '#e2e8f0';
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(moonX, moonY, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = curSkyTop;
        ctx.beginPath();
        ctx.arc(moonX + 5, moonY - 3, 11, 0, Math.PI * 2);
        ctx.fill();
      }

      const cloudAlpha = 0.25 - (nightFactor * 0.15);
      ctx.fillStyle = `rgba(255, 255, 255, ${cloudAlpha})`;
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 22, 0, Math.PI * 2);
        ctx.arc(c.x + 18, c.y - 8, 28, 0, Math.PI * 2);
        ctx.arc(c.x + 36, c.y, 20, 0, Math.PI * 2);
        ctx.fill();
      });

      // Земля и газон
      const dayGrass = [34, 197, 94];
      const nightGrass = [15, 80, 42];
      ctx.fillStyle = interpolateColor(dayGrass, nightGrass, nightFactor);
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      const daySoil = [22, 163, 74];
      const nightSoil = [9, 58, 30];
      ctx.fillStyle = interpolateColor(daySoil, nightSoil, nightFactor);
      ctx.fillRect(0, groundY + 8, canvas.width, 5);

      // Пыль из-под лап
      particles.forEach(p => {
        ctx.fillStyle = `rgba(200, 200, 200, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Отрисовка реалистичных объектов
      for (const obj of items) {
        if (obj.type === 'sausage') {
          drawRealisticSausage(obj.x, obj.y, obj.w, obj.h);
        } else if (obj.type === 'bone') {
          drawRealisticBone(obj.x, obj.y, obj.w, obj.h);
        } else if (obj.type === 'log') {
          drawRealisticLog(obj.x, obj.y, obj.w, obj.h);
        } else if (obj.type === 'cat') {
          drawRealisticCat(obj.x, obj.y, obj.w, obj.h);
        } else if (obj.type === 'eagle') {
          drawRealisticEagle(obj.x, obj.y, obj.w, obj.h);
        }
      }

      // Отрисовка таксы
      drawRealisticDachshund(taxa, groundY);
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      initAudio();
      resetGame();
      overlay.classList.add('hidden');
      isPlaying = true;
      haptic('impact');
    }

    resetGame();
    gameLoop();
  </script>
</body>
