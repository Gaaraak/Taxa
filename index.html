<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Long Doge & Round Boy</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      background: #2b1b17;
      touch-action: none;
    }
    /* Плавающий интерфейс */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hud {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      font-size: 16px;
    }
    .hud span {
      background: rgba(0,0,0,0.5);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    /* Оверлеи меню */
    .modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      pointer-events: auto;
      z-index: 100;
    }
    .modal.hidden {
      display: none !important;
    }
    .card {
      background: #1c1c1e;
      border: 2px solid #ff9500;
      border-radius: 24px;
      padding: 24px 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .card h1 {
      font-size: 20px;
      margin-bottom: 14px;
      color: #ff9500;
    }
    .card ul {
      text-align: left;
      font-size: 13px;
      color: #ccc;
      margin-bottom: 18px;
      line-height: 1.5;
      list-style: none;
    }
    .card ul li {
      margin-bottom: 8px;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #ff9500, #ff3b30);
      color: #fff;
      border: none;
      padding: 15px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,149,0,0.4);
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active {
      transform: scale(0.97);
    }
    /* Мобильные элементы управления */
    #touch-controls {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 20px;
      pointer-events: auto;
      gap: 12px;
    }
    .ctrl-btn {
      background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.3);
      color: #fff;
      border-radius: 20px;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      backdrop-filter: blur(5px);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .ctrl-btn:active {
      background: rgba(255,149,0,0.5);
    }
    .steer-btn {
      flex: 1;
    }
    .hop-btn {
      flex: 1.4;
      background: rgba(255,149,0,0.3);
      border-color: #ff9500;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    /* Индикатор тревоги */
    #warning-badge {
      display: none;
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff3b30;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 12px;
      box-shadow: 0 0 15px #ff3b30;
      animation: blink 0.3s infinite alternate;
    }
    @keyframes blink {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="game"></canvas>

  <div id="ui-layer">
    <div class="hud">
      <span id="score-val">🌭 0 сосисок</span>
      <span id="dist-val">0 м</span>
    </div>
    <div id="warning-badge">⚠️ КОГТИ! ЖМИ ПОДБРОС!</div>
    
    <div id="touch-controls">
      <button class="ctrl-btn steer-btn" id="left-btn">◀</button>
      <button class="ctrl-btn hop-btn" id="hop-btn">ПОДБРОС 🦘</button>
      <button class="ctrl-btn steer-btn" id="right-btn">▶</button>
    </div>
  </div>

  <!-- Старт -->
  <div id="start-modal" class="modal">
    <div class="card">
      <h1>🌭 LONG DOGE & ROUND BOY</h1>
      <ul>
        <li>🌭 <b>Ешь сосиски</b>, чтобы такса росла длиннее!</li>
        <li>🐭 <b>Балансируй шиншиллу:</b> она соскальзывает на резких поворотах.</li>
        <li>🦘 <b>ПОДБРОС:</b> если сползает — жми кнопку по центру, чтобы поймать её!</li>
      </ul>
      <button class="btn" id="start-btn">ПОГНАААЛИ! 🚀</button>
      <p style="margin-top: 12px; font-size: 12px; color: #888;" id="best-score">Рекорд: 0</p>
    </div>
  </div>

  <!-- Game Over -->
  <div id="over-modal" class="modal hidden">
    <div class="card">
      <h1 id="over-title">ШИНШИЛЛА УЛЕТЕЛА!</h1>
      <p style="font-size: 15px; margin: 10px 0 20px 0;" id="over-reason"></p>
      <p style="font-size: 18px; margin-bottom: 20px;" id="final-stats"></p>
      <button class="btn" id="restart-btn">ЕЩЁ РАЗОК 🔄</button>
    </div>
  </div>
</div>

<script>
(() => {
  // --- АУДИО (Web Audio API со снятием блокировки мобилок) ---
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playSound(type) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const t = audioCtx.currentTime;

      if (type === 'eat') {
        osc.frequency.setValueAtTime(400, t);
        osc.frequency.exponentialRampToValueAtTime(800, t + 0.1);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.1);
        osc.start(t);
        osc.stop(t + 0.1);
      } else if (type === 'hop') {
        osc.frequency.setValueAtTime(250, t);
        osc.frequency.exponentialRampToValueAtTime(600, t + 0.18);
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.18);
        osc.start(t);
        osc.stop(t + 0.18);
      } else if (type === 'crash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, t);
        osc.frequency.exponentialRampToValueAtTime(40, t + 0.3);
        gain.gain.setValueAtTime(0.5, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.3);
        osc.start(t);
        osc.stop(t + 0.3);
      }
    } catch(e) {}
  }

  // --- ХОЛСТ И РЕСАЙЗ ---
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let cw = 0, ch = 0;

  function resize() {
    cw = window.innerWidth;
    ch = window.innerHeight;
    canvas.width = cw;
    canvas.height = ch;
  }
  window.addEventListener('resize', resize);
  resize();

  // --- СОСТОЯНИЕ ИГРЫ ---
  let isRunning = false;
  let score = 0;
  let distance = 0;
  let best = parseInt(localStorage.getItem('long_doge_best') || '0', 10);
  document.getElementById('best-score').textContent = `Рекорд: ${best} сосисок`;

  const road = { width: 0, left: 0, speed: 6 };

  // ТАКСА
  const SEG_DIST = 18;
  let segments = [];
  let baseLength = 16;
  let dogX = 0;
  let steerDir = 0; // -1, 0, 1

  // ШИНШИЛЛА
  let chin = {
    segIdx: 6,
    offset: 0,       // смещение от центра позвоночника (-1 .. 1)
    vel: 0,          // боковая скорость
    isHopping: false,
    hopY: 0,
    hopVy: 0
  };

  // ПРЕДМЕТЫ
  let items = [];
  let itemSpawnTimer = 0;

  function resetGame() {
    road.width = Math.min(cw * 0.82, 380);
    road.left = (cw - road.width) / 2;
    dogX = road.left + road.width / 2;

    score = 0;
    distance = 0;
    road.speed = 6;
    steerDir = 0;

    // Сборка таксы
    segments = [];
    const headY = ch * 0.65;
    for (let i = 0; i < baseLength; i++) {
      segments.push({ x: dogX, y: headY + i * SEG_DIST });
    }

    chin.segIdx = Math.floor(segments.length / 2);
    chin.offset = 0;
    chin.vel = 0;
    chin.isHopping = false;
    chin.hopY = 0;
    chin.hopVy = 0;

    items = [];
    itemSpawnTimer = 0;
    updateUI();
  }

  function updateUI() {
    document.getElementById('score-val').textContent = `🌭 ${score} сосисок`;
    document.getElementById('dist-val').textContent = `${Math.floor(distance)} м`;
  }

  // --- УПРАВЛЕНИЕ ---
  let keyLeft = false, keyRight = false;
  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keyLeft = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keyRight = true;
    if (e.code === 'Space') rescueHop();
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keyLeft = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keyRight = false;
  });

  // Кнопки на экране
  const lBtn = document.getElementById('left-btn');
  const rBtn = document.getElementById('right-btn');
  const hBtn = document.getElementById('hop-btn');

  function bindTouch(btn, onDown, onUp) {
    btn.addEventListener('touchstart', e => { e.preventDefault(); onDown(); }, { passive: false });
    btn.addEventListener('touchend', e => { e.preventDefault(); onUp(); }, { passive: false });
    btn.addEventListener('mousedown', onDown);
    btn.addEventListener('mouseup', onUp);
    btn.addEventListener('mouseleave', onUp);
  }

  bindTouch(lBtn, () => keyLeft = true, () => keyLeft = false);
  bindTouch(rBtn, () => keyRight = true, () => keyRight = false);
  bindTouch(hBtn, () => rescueHop(), () => {});

  function rescueHop() {
    if (!isRunning || chin.isHopping) return;
    initAudio();
    chin.isHopping = true;
    chin.hopVy = -7;
    chin.vel = 0; // Сброс бокового скольжения при подбросе!
    playSound('hop');
  }

  // --- СТАРТ И ФИНИШ ---
  const startModal = document.getElementById('start-modal');
  const overModal = document.getElementById('over-modal');
  const startBtn = document.getElementById('start-btn');
  const restartBtn = document.getElementById('restart-btn');

  function startGame() {
    initAudio();
    startModal.classList.add('hidden');
    overModal.classList.add('hidden');
    resetGame();
    isRunning = true;
  }

  function gameOver(reason) {
    isRunning = false;
    playSound('crash');
    if (score > best) {
      best = score;
      localStorage.setItem('long_doge_best', best);
    }
    document.getElementById('over-reason').textContent = reason;
    document.getElementById('final-stats').textContent = `Счёт: ${score} сосисок | Пробег: ${Math.floor(distance)}м`;
    overModal.classList.remove('hidden');
  }

  ['click', 'touchstart'].forEach(ev => {
    startBtn.addEventListener(ev, (e) => { e.preventDefault(); startGame(); }, { passive: false });
    restartBtn.addEventListener(ev, (e) => { e.preventDefault(); startGame(); }, { passive: false });
  });

  // --- СПАВН ПРЕПЯТСТВИЙ И СОСИСОК ---
  function spawnItem() {
    const isSausage = Math.random() < 0.45;
    const itemX = road.left + 35 + Math.random() * (road.width - 70);
    items.push({
      x: itemX,
      y: -50,
      radius: isSausage ? 16 : 22,
      type: isSausage ? 'sausage' : (Math.random() < 0.5 ? 'slipper' : 'vacuum')
    });
  }

  // --- ИГРОВОЙ ЦИКЛ ---
  let lastTime = performance.now();

  function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    if (isRunning) {
      update(dt);
    }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function update(dt) {
    distance += road.speed * dt;
    road.speed = 6 + Math.min(distance * 0.005, 5);

    // 1. Управление головой и сдвиг всей таксы
    let moveDir = 0;
    if (keyLeft) moveDir -= 1;
    if (keyRight) moveDir += 1;

    const targetX = dogX + moveDir * 280 * dt;
    const minX = road.left + 25;
    const maxX = road.left + road.width - 25;
    dogX = Math.max(minX, Math.min(maxX, targetX));

    // Обновление сегментов (цепочка инверсной кинематики)
    segments[0].x += (dogX - segments[0].x) * 0.35;
    for (let i = 1; i < segments.length; i++) {
      const prev = segments[i - 1];
      const cur = segments[i];
      const dx = cur.x - prev.x;
      const dy = cur.y - prev.y;
      const angle = Math.atan2(dy, dx);
      cur.x = prev.x + Math.cos(angle) * SEG_DIST;
      cur.y = prev.y + Math.sin(angle) * SEG_DIST;
    }

    // 2. Спавн и движение объектов
    itemSpawnTimer += dt;
    if (itemSpawnTimer > Math.max(0.7, 1.4 - distance * 0.003)) {
      itemSpawnTimer = 0;
      spawnItem();
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += road.speed * 60 * dt;

      // Столкновения с телом таксы
      for (let s = 0; s < segments.length; s++) {
        const seg = segments[s];
        const dist = Math.hypot(it.x - seg.x, it.y - seg.y);
        if (dist < it.radius + 18) {
          if (it.type === 'sausage') {
            score++;
            playSound('eat');
            // Удлиняем таксу
            const last = segments[segments.length - 1];
            segments.push({ x: last.x, y: last.y + SEG_DIST });
            chin.segIdx = Math.floor(segments.length / 2);
            items.splice(i, 1);
            updateUI();
          } else {
            gameOver(it.type === 'slipper' ? 'Такса споткнулась о тапок!' : 'Робот-пылесос засосал таксу!');
            return;
          }
          break;
        }
      }

      if (it && it.y > ch + 60) {
        items.splice(i, 1);
      }
    }

    // 3. Физика шиншиллы
    const chinSeg = segments[Math.min(chin.segIdx, segments.length - 1)];
    const prevSeg = segments[Math.max(0, chin.segIdx - 1)];
    const tilt = (chinSeg.x - prevSeg.x) * 0.04; // наклон хребта

    if (chin.isHopping) {
      chin.hopY += chin.hopVy;
      chin.hopVy += 25 * dt; // гравитация
      chin.offset *= 0.92;   // подтягивание к центру в полете
      if (chin.hopY >= 0) {
        chin.hopY = 0;
        chin.isHopping = false;
        chin.hopVy = 0;
      }
    } else {
      // Скатывание по наклону
      chin.vel += tilt * 3.5 * dt;
      chin.vel *= 0.94; // трение шерсти
      chin.offset += chin.vel;

      // Магнитная стабилизация возле центра
      if (Math.abs(chin.offset) < 0.3) {
        chin.offset *= 0.95;
      }

      // Индикатор тревоги
      const warn = document.getElementById('warning-badge');
      if (Math.abs(chin.offset) > 0.65) {
        warn.style.display = 'block';
      } else {
        warn.style.display = 'none';
      }

      // Падение со спины
      if (Math.abs(chin.offset) > 1.3) {
        gameOver('Шиншилла не удержалась и покатилась кубарем!');
      }
    }
  }

  // --- ОТРИСОВКА ---
  function render() {
    ctx.clearRect(0, 0, cw, ch);

    // Пол (доски ламината)
    ctx.fillStyle = '#3a2318';
    ctx.fillRect(0, 0, cw, ch);
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 3;
    const boardW = 60;
    for (let x = 0; x < cw; x += boardW) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, ch);
      ctx.stroke();
    }

    // Ковер (дорожка)
    ctx.fillStyle = '#611a24';
    ctx.fillRect(road.left, 0, road.width, ch);
    // Бахрома и кант ковра
    ctx.fillStyle = '#d4a359';
    ctx.fillRect(road.left, 0, 8, ch);
    ctx.fillRect(road.left + road.width - 8, 0, 8, ch);

    // Препятствия и еда
    for (const it of items) {
      ctx.save();
      ctx.translate(it.x, it.y);
      if (it.type === 'sausage') {
        ctx.fillStyle = '#ff4d4d';
        ctx.beginPath();
        ctx.roundRect(-16, -8, 32, 16, 8);
        ctx.fill();
        ctx.fillStyle = '#ffd152';
        ctx.fillRect(-6, -4, 12, 8);
      } else if (it.type === 'slipper') {
        ctx.fillStyle = '#3a86ff';
        ctx.beginPath();
        ctx.ellipse(0, 0, 14, 22, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(-10, -5, 20, 6);
      } else {
        // Робот-пылесос
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#00f2fe';
        ctx.beginPath();
        ctx.arc(0, -6, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Такса (прорисовка от хвоста к голове)
    if (segments.length > 0) {
      // Лапки
      ctx.fillStyle = '#8a4213';
      for (let i = 2; i < segments.length - 1; i += 3) {
        const s = segments[i];
        ctx.beginPath();
        ctx.arc(s.x - 22, s.y, 6, 0, Math.PI * 2);
        ctx.arc(s.x + 22, s.y, 6, 0, Math.PI * 2);
        ctx.fill();
      }

      // Тело-сосиска
      for (let i = segments.length - 1; i >= 0; i--) {
        const s = segments[i];
        ctx.fillStyle = '#b3541e';
        ctx.beginPath();
        ctx.arc(s.x, s.y, 18, 0, Math.PI * 2);
        ctx.fill();
      }

      // Мордочка таксы
      const head = segments[0];
      ctx.save();
      ctx.translate(head.x, head.y);
      
      // Уши
      ctx.fillStyle = '#7a330a';
      ctx.beginPath();
      ctx.ellipse(-16, 4, 7, 14, 0.3, 0, Math.PI * 2);
      ctx.ellipse(16, 4, 7, 14, -0.3, 0, Math.PI * 2);
      ctx.fill();

      // Глаза
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-7, -4, 5, 0, Math.PI * 2);
      ctx.arc(7, -4, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(-7, -5, 2.5, 0, Math.PI * 2);
      ctx.arc(7, -5, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Нос
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(0, -14, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      // Шиншилла на спине
      const cSeg = segments[Math.min(chin.segIdx, segments.length - 1)];
      const chinX = cSeg.x + chin.offset * 26;
      const chinY = cSeg.y + chin.hopY;

      ctx.save();
      ctx.translate(chinX, chinY);

      // Тень при прыжке
      if (chin.isHopping) {
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(0, -chin.hopY, 14, 8, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Круглое пушистое тело шиншиллы
      ctx.fillStyle = '#a8b0b8';
      ctx.beginPath();
      ctx.arc(0, 0, 16, 0, Math.PI * 2);
      ctx.fill();

      // Розовые круглые ушки
      ctx.fillStyle = '#ffafcc';
      ctx.beginPath();
      ctx.arc(-11, -12, 6, 0, Math.PI * 2);
      ctx.arc(11, -12, 6, 0, Math.PI * 2);
      ctx.fill();

      // Бусинки глаз и носик
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(-5, -2, 2.5, 0, Math.PI * 2);
      ctx.arc(5, -2, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff758f';
      ctx.beginPath();
      ctx.arc(0, 2, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }
})();
</script>
</body>
</html>
