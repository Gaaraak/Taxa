<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Где такса?</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #0f111a);
      --text-color: var(--tg-theme-text-color, #ffffff);
      --card-bg: var(--tg-theme-secondary-bg-color, #1a1d2e);
      --btn-color: var(--tg-theme-button-color, #ff4757);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --accent: #ffa502;
      --success: #2ed573;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      width: 100%;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
      color: var(--accent);
      text-shadow: 0 2px 10px rgba(255, 165, 2, 0.25);
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .badge {
      background: var(--card-bg);
      padding: 6px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-container {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0;
    }

    .status {
      font-size: 1.05rem;
      font-weight: 600;
      text-align: center;
      transition: color 0.2s;
    }

    /* Игровая сцена */
    .game-area {
      position: relative;
      width: 100%;
      max-width: 360px;
      height: 140px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      perspective: 900px;
      margin: 10px 0;
    }

    .cup-slot {
      position: relative;
      width: 96px;
      height: 120px;
      cursor: pointer;
      transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .item-behind {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 66px;
      height: 66px;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.2s, transform 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .taxa-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid var(--accent);
      box-shadow: 0 0 14px rgba(255, 165, 2, 0.6);
    }

    .empty-icon {
      font-size: 38px;
    }

    .box {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #25283d, #161826);
      border: 2px solid #3d4263;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      z-index: 2;
      transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .cup-slot.revealed .box {
      transform: translateY(-60px) scale(0.88);
    }

    .cup-slot.revealed .item-behind {
      opacity: 1;
      transform: translateX(-50%) translateY(-12px) scale(1.12);
    }

    /* Магазин скинов */
    .shop-section {
      width: 100%;
      max-width: 360px;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .shop-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .skins-grid {
      display: flex;
      justify-content: space-around;
      gap: 6px;
    }

    .skin-item {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 6px;
      width: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      font-size: 20px;
      transition: 0.2s;
    }

    .skin-item.active {
      border-color: var(--accent);
      background: rgba(255, 165, 2, 0.15);
    }

    .skin-item.locked {
      opacity: 0.45;
    }

    .skin-price {
      font-size: 0.65rem;
      margin-top: 4px;
      font-weight: 600;
    }

    /* Кнопки управления */
    .controls {
      width: 100%;
      max-width: 360px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 1.05rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      background: var(--btn-color);
      color: var(--btn-text);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 71, 87, 0.35);
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>🔎 Где такса?</h1>
    <div class="stats-bar">
      <div class="badge">💰 Монеты: <span id="coins" style="color: var(--accent);">0</span></div>
      <div class="badge">🏆 Рекорд: <span id="best-score">0</span></div>
      <div class="badge">🔥 Серия: <span id="streak">0</span></div>
      <div class="badge">⚡ <span id="mult" style="color: var(--success);">x1</span></div>
    </div>
  </header>

  <div class="status-container">
    <div class="status" id="status-text">Нажми «Перемешать», чтобы начать</div>
  </div>

  <div class="game-area" id="board">
    <div class="cup-slot" data-index="0" onclick="chooseCup(0)">
      <div class="item-behind" id="item-0"></div>
      <div class="box" id="box-0">📦</div>
    </div>
    <div class="cup-slot" data-index="1" onclick="chooseCup(1)">
      <div class="item-behind" id="item-1"></div>
      <div class="box" id="box-1">📦</div>
    </div>
    <div class="cup-slot" data-index="2" onclick="chooseCup(2)">
      <div class="item-behind" id="item-2"></div>
      <div class="box" id="box-2">📦</div>
    </div>
  </div>

  <div class="shop-section">
    <div class="shop-title">Скины для коробок</div>
    <div class="skins-grid" id="skins-container">
      <!-- Скины генерируются скриптом -->
    </div>
  </div>

  <div class="controls">
    <button id="start-btn" onclick="startShuffle()">Перемешать</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Звуковой движок (Web Audio API)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration, delay = 0) {
      try {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + duration);
      } catch (e) {}
    }

    function playSound(type) {
      initAudio();
      if (type === 'shuffle') {
        playTone(220 + Math.random() * 80, 'triangle', 0.08);
      } else if (type === 'win') {
        playTone(440, 'sine', 0.15, 0);
        playTone(554.37, 'sine', 0.15, 0.1);
        playTone(659.25, 'sine', 0.25, 0.2);
        playTone(880, 'sine', 0.35, 0.3);
      } else if (type === 'lose') {
        playTone(280, 'sawtooth', 0.15, 0);
        playTone(196, 'sawtooth', 0.3, 0.15);
      }
    }

    function haptic(type) {
      if (!tg?.HapticFeedback) return;
      if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
      else if (type === 'impact') tg.HapticFeedback.impactOccurred('medium');
    }

    // Сохранение и состояние
    let coins = parseInt(localStorage.getItem('taxa_coins') || '0');
    let bestScore = parseInt(localStorage.getItem('taxa_best') || '0');
    let unlockedSkins = JSON.parse(localStorage.getItem('taxa_unlocked') || '["📦"]');
    let currentSkin = localStorage.getItem('taxa_current_skin') || '📦';

    const skinsList = [
      { icon: '📦', price: 0 },
      { icon: '🏠', price: 50 },
      { icon: '🎩', price: 120 },
      { icon: '🎁', price: 250 },
      { icon: '🛸', price: 500 }
    ];

    let streak = 0;
    let targetIndex = 1;
    let isShuffling = false;
    let isInteractive = false;

    const slots = document.querySelectorAll('.cup-slot');
    const statusText = document.getElementById('status-text');
    const startBtn = document.getElementById('start-btn');
    const coinsVal = document.getElementById('coins');
    const bestVal = document.getElementById('best-score');
    const streakVal = document.getElementById('streak');
    const multVal = document.getElementById('mult');

    function saveState() {
      localStorage.setItem('taxa_coins', coins);
      localStorage.setItem('taxa_best', bestScore);
      localStorage.setItem('taxa_unlocked', JSON.stringify(unlockedSkins));
      localStorage.setItem('taxa_current_skin', currentSkin);
    }

    function renderShop() {
      const container = document.getElementById('skins-container');
      container.innerHTML = '';
      skinsList.forEach(item => {
        const isUnlocked = unlockedSkins.includes(item.icon);
        const isActive = currentSkin === item.icon;

        const div = document.createElement('div');
        div.className = `skin-item ${isActive ? 'active' : ''} ${!isUnlocked ? 'locked' : ''}`;
        div.onclick = () => handleSkinClick(item);

        div.innerHTML = `
          <span>${item.icon}</span>
          <span class="skin-price">${isActive ? 'Взят' : (isUnlocked ? 'Выбрать' : item.price + '🪙')}</span>
        `;
        container.appendChild(div);
      });

      for (let i = 0; i < 3; i++) {
        document.getElementById(`box-${i}`).textContent = currentSkin;
      }
    }

    function handleSkinClick(skin) {
      if (isShuffling) return;
      initAudio();

      if (unlockedSkins.includes(skin.icon)) {
        currentSkin = skin.icon;
        haptic('impact');
      } else if (coins >= skin.price) {
        coins -= skin.price;
        unlockedSkins.push(skin.icon);
        currentSkin = skin.icon;
        haptic('success');
      } else {
        haptic('error');
        statusText.style.color = 'var(--btn-color)';
        statusText.textContent = `Нужно ${skin.price} монет!`;
        return;
      }
      saveState();
      updateUI();
      renderShop();
    }

    function getMultiplier(curStreak) {
      if (curStreak >= 10) return 5;
      if (curStreak >= 6) return 3;
      if (curStreak >= 3) return 2;
      return 1;
    }

    function renderItems() {
      for (let i = 0; i < 3; i++) {
        const itemBox = document.getElementById(`item-${i}`);
        if (i === targetIndex) {
          itemBox.innerHTML = '<img class="taxa-photo" src="taxa.jpg" alt="Такса">';
        } else {
          itemBox.innerHTML = '<span class="empty-icon">💨</span>';
        }
      }
    }

    function updateUI() {
      coinsVal.textContent = coins;
      bestVal.textContent = bestScore;
      streakVal.textContent = streak;
      multVal.textContent = `x${getMultiplier(streak)}`;
    }

    async function startShuffle() {
      if (isShuffling) return;
      initAudio();
      haptic('impact');

      isInteractive = false;
      isShuffling = true;
      startBtn.disabled = true;
      statusText.textContent = 'Такса спряталась...';
      statusText.style.color = 'var(--text-color)';

      slots.forEach(slot => slot.classList.remove('revealed'));
      await sleep(350);

      targetIndex = Math.floor(Math.random() * 3);
      renderItems();

      statusText.textContent = 'Внимательно следи! 👀';

      const swaps = 6 + Math.min(streak, 8);
      const speed = Math.max(130, 300 - streak * 16);
      let order = [0, 1, 2];

      for (let i = 0; i < swaps; i++) {
        const i1 = Math.floor(Math.random() * 3);
        let i2 = Math.floor(Math.random() * 3);
        while (i2 === i1) i2 = Math.floor(Math.random() * 3);

        const temp = order[i1];
        order[i1] = order[i2];
        order[i2] = temp;

        applyPositions(order);
        playSound('shuffle');
        haptic('impact');
        await sleep(speed);
      }

      slots.forEach(slot => slot.style.transform = 'none');
      targetIndex = order.indexOf(targetIndex);
      renderItems();

      statusText.textContent = 'Где такса? Выбирай!';
      isShuffling = false;
      isInteractive = true;
    }

    function applyPositions(order) {
      const distance = 110;
      for (let currentPos = 0; currentPos < 3; currentPos++) {
        const originalIndex = order[currentPos];
        const offset = (currentPos - originalIndex) * distance;
        slots[originalIndex].style.transform = `translateX(${offset}px)`;
      }
    }

    function chooseCup(chosenIndex) {
      if (!isInteractive || isShuffling) return;
      isInteractive = false;

      slots.forEach(slot => slot.classList.add('revealed'));

      if (chosenIndex === targetIndex) {
        streak += 1;
        const mult = getMultiplier(streak);
        const earned = 10 * mult;
        coins += earned;

        if (streak > bestScore) bestScore = streak;

        playSound('win');
        haptic('success');
        statusText.style.color = 'var(--success)';
        statusText.textContent = `Нашёл! +${earned} монет (Комбо x${mult}) 🎉`;
      } else {
        streak = 0;
        playSound('lose');
        haptic('error');
        statusText.style.color = 'var(--btn-color)';
        statusText.textContent = 'Мимо! Такса ускользнула 💨';
      }

      saveState();
      updateUI();
      startBtn.disabled = false;
      startBtn.textContent = 'Сыграть ещё';
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    updateUI();
    renderShop();
    renderItems();
  </script>
</body>
</html>
