<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Такса-Раннер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #12131c;
      --card: #1d2030;
      --accent: #ffa502;
      --btn: #ff4757;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      overflow: hidden;
      touch-action: manipulation;
    }

    header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px;
    }

    .badge {
      background: var(--card);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 380px;
      background: linear-gradient(180deg, #1e2746 0%, #2f3654 60%, #404b69 100%);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.45);
      border: 2px solid #373e5c;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Оверлей меню/рестарта */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 17, 26, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      z-index: 10;
      transition: opacity 0.2s;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h2 {
      font-size: 1.8rem;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .overlay p {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .btn {
      background: var(--btn);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 800;
      padding: 14px 28px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
      transition: transform 0.1s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .controls-hint {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">🌭 Длина: <span id="length-val" style="color: var(--accent);">1</span> м</div>
    <div class="badge">🏆 Рекорд: <span id="best-val">0</span> м</div>
  </header>

  <div id="game-container">
    <canvas id="canvas" width="420" height="380"></canvas>

    <div class="overlay" id="overlay">
      <h2 id="overlay-title">🐶 Длинная Такса</h2>
      <p id="overlay-desc">Тапай по экрану, чтобы прыгать!<br>Собирай сосиски 🌭 и удлиняй таксу.<br>Берегись заборов 🪵 и котов 🐱!</p>
      <button class="btn" id="start-btn" onclick="startGame()">ИГРАТЬ</button>
    </div>
  </div>

  <div class="controls-hint">Тапни в любом месте игрового поля для прыжка</div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function haptic(type) {
      if (!tg?.HapticFeedback) return;
      if (type === 'impact') tg.HapticFeedback.impactOccurred('medium');
      if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
    }

    // Аудио эффекты
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, duration, type = 'sine') {
      try {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const lengthVal = document.getElementById('length-val');
    const bestVal = document.getElementById('best-val');

    let bestScore = parseInt(localStorage.getItem('taxa_runner_best') || '1');
    bestVal.textContent = bestScore;

    // Загрузка фото таксы для мордочки
    const taxaImg = new Image();
    taxaImg.src = 'taxa.jpg';

    // Параметры игры
    let isPlaying = false;
    let frame = 0;
    let groundY = 310;
    let speed = 4;
    let sausageCount = 0;

    // Персонаж: Такса
    const taxa = {
      x: 70,
      y: groundY - 32,
      baseW: 34,
      bodySegmentLen: 12,
      segments: 2, // длина таксы
      h: 28,
      vy: 0,
      gravity: 0.72,
      jumpStrength: -11.5,
      isGrounded: true
    };

    let items = []; // Сосиски и препятствия

    function resetGame() {
      taxa.y = groundY - taxa.h;
      taxa.vy = 0;
      taxa.segments = 2;
      taxa.isGrounded = true;
      sausageCount = 0;
      speed = 4;
      items = [];
      frame = 0;
      updateUI();
    }

    function updateUI() {
      const currentLen = Math.floor(taxa.segments * 0.5);
      lengthVal.textContent = currentLen;
      if (currentLen > bestScore) {
        bestScore = currentLen;
        localStorage.setItem('taxa_runner_best', bestScore);
        bestVal.textContent = bestScore;
      }
    }

    function jump() {
      if (!isPlaying) return;
      initAudio();
      if (taxa.isGrounded) {
        taxa.vy = taxa.jumpStrength;
        taxa.isGrounded = false;
        playTone(380, 0.12, 'square');
        haptic('impact');
      }
    }

    // Слушатели клика/тапа для прыжка
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      jump();
    });

    function spawnObjects() {
      // Спавн сосисок
      if (frame % 85 === 0) {
        items.push({
          type: 'sausage',
          x: canvas.width + 20,
          y: groundY - 30 - Math.random() * 55,
          w: 24,
          h: 14,
          icon: '🌭'
        });
      }

      // Спавн препятствий (забор или кот)
      if (frame % 150 === 0 && frame > 40) {
        const isCat = Math.random() > 0.5;
        items.push({
          type: 'obstacle',
          x: canvas.width + 30,
          y: groundY - 32,
          w: 26,
          h: 30,
          icon: isCat ? '🐱' : '🪵'
        });
      }
    }

    function gameOver() {
      isPlaying = false;
      playTone(180, 0.35, 'sawtooth');
      haptic('error');

      overlayTitle.textContent = 'Ой! Столкновение 💥';
      overlayDesc.innerHTML = `Твоя такса выросла до <b>${Math.floor(taxa.segments * 0.5)} м</b>!<br>Собрано сосисок: <b>${sausageCount}</b> шт.`;
      document.getElementById('start-btn').textContent = 'ЕЩЁ РАЗ';
      overlay.classList.remove('hidden');
    }

    function update() {
      if (!isPlaying) return;
      frame++;

      // Физика прыжка
      taxa.vy += taxa.gravity;
      taxa.y += taxa.vy;
      if (taxa.y >= groundY - taxa.h) {
        taxa.y = groundY - taxa.h;
        taxa.vy = 0;
        taxa.isGrounded = true;
      }

      spawnObjects();

      // Движение и коллизии
      for (let i = items.length - 1; i >= 0; i--) {
        const obj = items[i];
        obj.x -= speed;

        // Коллизия с сосиской
        if (obj.type === 'sausage') {
          const taxaFullWidth = taxa.baseW + (taxa.segments * taxa.bodySegmentLen);
          const taxaLeft = taxa.x - (taxa.segments * taxa.bodySegmentLen);

          if (
            taxa.x + taxa.baseW > obj.x &&
            taxaLeft < obj.x + obj.w &&
            taxa.y + taxa.h > obj.y &&
            taxa.y < obj.y + obj.h
          ) {
            // Съел сосиску
            sausageCount++;
            taxa.segments += 1; // Удлиняем туловище!
            speed = Math.min(8.5, 4 + taxa.segments * 0.15); // ускоряем бег
            playTone(660, 0.1, 'sine');
            haptic('impact');
            items.splice(i, 1);
            updateUI();
            continue;
          }
        }

        // Коллизия с препятствием (хрупкая зона: голова и передние лапы)
        if (obj.type === 'obstacle') {
          const taxaHeadX = taxa.x + 10;
          if (
            taxaHeadX + 20 > obj.x + 4 &&
            taxaHeadX < obj.x + obj.w - 4 &&
            taxa.y + taxa.h > obj.y + 6
          ) {
            gameOver();
            return;
          }
        }

        // Удаление ушедших за экран объектов
        if (obj.x < -60) {
          items.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Земля / газон
      ctx.fillStyle = '#27ae60';
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      // Декоративная полоса грунта
      ctx.fillStyle = '#1e824c';
      ctx.fillRect(0, groundY + 8, canvas.width, 4);

      // Отрисовка сосисок и препятствий
      ctx.font = '22px sans-serif';
      ctx.textAlign = 'center';
      for (const obj of items) {
        ctx.fillText(obj.icon, obj.x + obj.w / 2, obj.y + obj.h - 2);
      }

      // Отрисовка Таксы
      const bodyY = taxa.y + 4;
      const bodyH = 20;
      const segmentW = taxa.bodySegmentLen;
      const totalBodyLen = taxa.segments * segmentW;

      // 1. Длинное коричневое туловище
      ctx.fillStyle = '#3d2314'; // Тёмно-коричневый
      ctx.beginPath();
      ctx.roundRect(taxa.x - totalBodyLen, bodyY, totalBodyLen + 15, bodyH, 10);
      ctx.fill();

      // Ошейник
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(taxa.x + 10, bodyY + 2, 5, bodyH - 4);

      // 2. Лапы (анимируются при беге)
      const legOffset = Math.sin(frame * 0.35) * 5;
      ctx.strokeStyle = '#2b180d';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';

      // Передние лапы
      ctx.beginPath();
      ctx.moveTo(taxa.x + 8, bodyY + bodyH);
      ctx.lineTo(taxa.x + 8 + (taxa.isGrounded ? legOffset : -3), bodyY + bodyH + 9);
      ctx.stroke();

      // Задние лапы (у самого хвоста)
      ctx.beginPath();
      ctx.moveTo(taxa.x - totalBodyLen + 6, bodyY + bodyH);
      ctx.lineTo(taxa.x - totalBodyLen + 6 - (taxa.isGrounded ? legOffset : 3), bodyY + bodyH + 9);
      ctx.stroke();

      // Хвостик
      ctx.beginPath();
      ctx.moveTo(taxa.x - totalBodyLen + 2, bodyY + 5);
      ctx.lineTo(taxa.x - totalBodyLen - 8, bodyY - 4 + Math.sin(frame * 0.4) * 3);
      ctx.stroke();

      // 3. Мордочка (Фото таксы или стилизованная голова)
      const headX = taxa.x + 12;
      const headY = taxa.y - 6;
      const headSize = 34;

      if (taxaImg.complete && taxaImg.naturalWidth !== 0) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(headX + headSize/2, headY + headSize/2, headSize/2, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(taxaImg, headX, headY, headSize, headSize);
        ctx.restore();

        // Рамочка вокруг фото мордочки
        ctx.strokeStyle = '#ffa502';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(headX + headSize/2, headY + headSize/2, headSize/2, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.font = '30px sans-serif';
        ctx.fillText('🐶', headX + headSize/2, headY + headSize - 4);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      initAudio();
      resetGame();
      overlay.classList.add('hidden');
      isPlaying = true;
      haptic('impact');
    }

    // Первичный запуск отрисовки
    resetGame();
    gameLoop();
  </script>
</body>
</html>
