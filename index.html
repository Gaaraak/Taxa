<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chinchilla Parkour: The Grand Climb</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: none;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Верхний HUD */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-left: 16px;
      padding-right: 16px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hud-chip {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 6px 14px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
    }

    .zone-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 5px 16px;
      border-radius: 20px;
    }
    .zone-indicator span.sub {
      font-size: 9px;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .zone-indicator span.val {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }

    /* Прогресс-бар до финиша */
    .climb-progress {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 6px 10px;
      backdrop-filter: blur(10px);
    }
    .climb-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }
    .climb-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #f59e0b);
      border-radius: 3px;
      transition: width 0.15s ease-out;
    }

    /* Мобильное управление */
    #touch-panel {
      position: absolute;
      bottom: 24px;
      left: 0;
      width: 100%;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 10;
    }

    .ctrl-group {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .t-btn {
      width: 66px;
      height: 66px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 22px;
      transition: transform 0.08s, background 0.08s;
    }
    .t-btn span.label {
      font-size: 9px;
      color: #cbd5e1;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .t-btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.25);
    }

    .jump-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: radial-gradient(circle, #3b82f6, #1d4ed8);
      border: 2px solid #93c5fd;
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.5);
    }

    /* Победное меню (Финал) */
    #victory-modal {
      position: absolute;
      inset: 0;
      background: rgba(10, 15, 30, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      color: white;
      text-align: center;
      padding: 24px;
    }
    #victory-modal h1 {
      font-size: 34px;
      color: #facc15;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(250, 204, 21, 0.6);
    }
    #victory-modal p {
      color: #94a3b8;
      font-size: 15px;
      max-width: 280px;
      line-height: 1.4;
      margin-bottom: 24px;
    }
    .stats-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 14px 24px;
      margin-bottom: 24px;
      display: flex;
      gap: 20px;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stat-item .stat-title {
      font-size: 11px;
      color: #94a3b8;
    }
    .stat-item .stat-num {
      font-size: 20px;
      font-weight: 800;
      color: #38bdf8;
    }

    .act-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      font-weight: 800;
      font-size: 16px;
      border: none;
      padding: 14px 34px;
      border-radius: 30px;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
      cursor: pointer;
    }
    .act-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

<div id="container">
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="top-bar">
      <div class="hud-chip">
        <span>🍒</span>
        <span id="berries-txt">0</span>
      </div>

      <div class="zone-indicator">
        <span class="sub" id="zone-sub">Этаж 1</span>
        <span class="val" id="zone-title">Гостиная</span>
      </div>

      <div class="hud-chip" style="color: #38bdf8;">
        <span id="height-txt">0.0 м</span>
      </div>
    </div>

    <div class="climb-progress">
      <div style="display: flex; justify-content: space-between; font-size: 10px; color: #94a3b8; font-weight: 700;">
        <span>ПРОГРЕСС ДО КРЫШИ</span>
        <span id="goal-percent">0%</span>
      </div>
      <div class="climb-track">
        <div class="climb-fill" id="climb-bar"></div>
      </div>
    </div>
  </div>

  <div id="touch-panel">
    <div class="ctrl-group">
      <div class="t-btn" id="btn-left">◀<span class="label">Влево</span></div>
      <div class="t-btn" id="btn-right">▶<span class="label">Вправо</span></div>
    </div>
    <div class="ctrl-group">
      <div class="t-btn" id="btn-crouch">▼<span class="label">Скат</span></div>
      <div class="t-btn jump-btn" id="btn-jump">▲<span class="label">Прыжок</span></div>
    </div>
  </div>

  <div id="victory-modal">
    <h1>🏆 ВЕРШИНА МИРА!</h1>
    <p>Шиншилла покорила все этажи и нашла Легендарный Золотой Шиповник!</p>
    
    <div class="stats-card">
      <div class="stat-item">
        <span class="stat-title">Лакомства</span>
        <span class="stat-num" id="win-berries">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-title">Время подъема</span>
        <span class="stat-num" id="win-time">00:00</span>
      </div>
      <div class="stat-item">
        <span class="stat-title">Высота</span>
        <span class="stat-num">100 м</span>
      </div>
    </div>

    <button class="act-btn" id="btn-continue">Бесконечный режим 🚀</button>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      tg.headerColor = '#0d1117';
    } catch(e) {}
  }

  function haptic(type = 'light') {
    try {
      if (tg?.HapticFeedback) {
        if (type === 'light') tg.HapticFeedback.impactOccurred('light');
        if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
        if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      }
    } catch(e) {}
  }

  // Звуки (Web Audio API)
  class SoundFX {
    constructor() { this.ctx = null; }
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    }
    tone(freq, type = 'sine', duration = 0.1, stopVol = 0.001) {
      if (!this.ctx) return;
      try {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        g.gain.setValueAtTime(0.18, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(stopVol, this.ctx.currentTime + duration);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      } catch(e) {}
    }
    jump() { this.tone(420, 'triangle', 0.12); }
    wall() { this.tone(580, 'sine', 0.1); }
    berry() { this.tone(960, 'sine', 0.16); }
    win() {
      if (!this.ctx) return;
      [440, 554, 659, 880].forEach((f, i) => {
        setTimeout(() => this.tone(f, 'triangle', 0.3), i * 140);
      });
    }
  }
  const sfx = new SoundFX();

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.resetTransform?.();
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  // Физика
  const GRAVITY = 1750;
  const AIR_RESIST = 0.992;
  const GROUND_FRICTION = 0.85;

  const player = {
    x: W / 2,
    y: H - 150,
    vx: 0,
    vy: 0,
    r: 16,
    facing: 1,

    isGrounded: false,
    isLedgeClimbing: false,
    stumbleTimer: 0,
    chargeTime: 0,

    squash: 1,
    stretch: 1,
    tailAngle: 0,
    pawCycle: 0,

    berries: 0,
    reset() {
      this.x = W / 2;
      this.y = H - 150;
      this.vx = 0;
      this.vy = 0;
      this.isLedgeClimbing = false;
      this.stumbleTimer = 0;
    }
  };

  const input = {
    left: false,
    right: false,
    crouch: false,
    jumpPressed: false,
    jumpHeld: false
  };

  // Локации (Уровни)
  const ZONES = [
    { maxH: 25, name: 'Гостиная', sub: 'Этаж 1', bg1: '#0f172a', bg2: '#1e1b4b', platColor: '#78350f', platEdge: '#b45309' },
    { maxH: 55, name: 'Чердак реликвий', sub: 'Этаж 2', bg1: '#18181b', bg2: '#27272a', platColor: '#475569', platEdge: '#94a3b8' },
    { maxH: 90, name: 'Ночные крыши', sub: 'Этаж 3', bg1: '#030712', bg2: '#0f172a', platColor: '#1e293b', platEdge: '#38bdf8' },
    { maxH: 9999, name: 'Обсерватория', sub: 'Финал', bg1: '#090514', bg2: '#2e1065', platColor: '#581c87', platEdge: '#facc15' }
  ];

  let currentZone = ZONES[0];
  let platforms = [];
  let berries = [];
  let particles = [];
  let confetti = [];
  let cameraY = 0;
  let maxHeight = 0;
  let gameStartTime = performance.now();
  let gameWon = false;
  let endlessMode = false;
  let finalShrine = null;

  function initWorld() {
    platforms = [];
    berries = [];
    particles = [];
    confetti = [];
    cameraY = 0;
    maxHeight = 0;
    gameWon = false;
    gameStartTime = performance.now();

    // Стартовая база
    platforms.push({ x: 0, y: H - 60, w: W, h: 60, type: 'start' });

    // Генерация уровня до 100 метров (высота ~ 4500px вверх)
    let curY = H - 160;
    while (curY > -4500) {
      const hMeters = (H - 150 - curY) / 45;
      const zone = getZone(hMeters);

      const w = 75 + Math.random() * 75;
      const x = 30 + Math.random() * (W - 60 - w);
      platforms.push({
        x,
        y: curY,
        w,
        h: 18,
        zone
      });

      // Спавн лакомств
      if (Math.random() < 0.6) {
        berries.push({
          x: x + w / 2,
          y: curY - 20,
          collected: false
        });
      }

      curY -= (75 + Math.random() * 45);
    }

    // Финальная платформа со святилищем на высоте 100 м
    finalShrine = {
      x: W / 2 - 80,
      y: -4500,
      w: 160,
      h: 24,
      collected: false
    };
    platforms.push(finalShrine);
  }

  function getZone(hMeters) {
    for (const z of ZONES) {
      if (hMeters <= z.maxH) return z;
    }
    return ZONES[ZONES.length - 1];
  }

  // Частицы и конфетти
  function emitDust(x, y, count = 6, color = 'rgba(255,255,255,0.7)') {
    for (let i = 0; i < count; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 80,
        vy: -Math.random() * 50,
        life: 0.35 + Math.random() * 0.2,
        color
      });
    }
  }

  function emitConfetti(x, y) {
    const colors = ['#facc15', '#38bdf8', '#f43f5e', '#a855f7', '#4ade80'];
    for (let i = 0; i < 90; i++) {
      confetti.push({
        x, y,
        vx: (Math.random() - 0.5) * 400,
        vy: -200 - Math.random() * 350,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: 4 + Math.random() * 4,
        life: 2.5
      });
    }
  }

  // Ввод (Клавиатура)
  window.addEventListener('keydown', (e) => {
    sfx.init();
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.left = true;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') input.right = true;
    if (e.code === 'KeyS' || e.code === 'ArrowDown') input.crouch = true;
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      if (!input.jumpHeld) input.jumpPressed = true;
      input.jumpHeld = true;
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.left = false;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') input.right = false;
    if (e.code === 'KeyS' || e.code === 'ArrowDown') input.crouch = false;
    if (e.code === 'Space' || e.code === 'ArrowUp') input.jumpHeld = false;
  });

  // Сенсорные кнопки
  function bindTouch(btn, onDown, onUp) {
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      sfx.init();
      onDown();
    }, { passive: false });
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (onUp) onUp();
    }, { passive: false });
  }

  bindTouch(document.getElementById('btn-left'), () => { input.left = true; }, () => { input.left = false; });
  bindTouch(document.getElementById('btn-right'), () => { input.right = true; }, () => { input.right = false; });
  bindTouch(document.getElementById('btn-crouch'), () => { input.crouch = true; }, () => { input.crouch = false; });
  bindTouch(document.getElementById('btn-jump'), () => {
    if (!input.jumpHeld) input.jumpPressed = true;
    input.jumpHeld = true;
  }, () => {
    input.jumpHeld = false;
  });

  // Логика победы
  function triggerVictory() {
    if (gameWon) return;
    gameWon = true;
    sfx.win();
    haptic('success');
    emitConfetti(player.x, player.y);

    const totalSeconds = Math.floor((performance.now() - gameStartTime) / 1000);
    const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
    const s = (totalSeconds % 60).toString().padStart(2, '0');

    document.getElementById('win-berries').innerText = player.berries;
    document.getElementById('win-time').innerText = `${m}:${s}`;
    document.getElementById('victory-modal').style.display = 'flex';
  }

  document.getElementById('btn-continue').onclick = () => {
    document.getElementById('victory-modal').style.display = 'none';
    endlessMode = true;
    // Разрешаем лезть дальше в космос
    finalShrine.collected = true;
  };

  // Физический цикл
  let lastTime = performance.now();

  function update(dt) {
    // Заминка при неудачном высоком падении
    if (player.stumbleTimer > 0) {
      player.stumbleTimer -= dt;
      player.vx *= 0.7;
      return;
    }

    // Подтягивание на край платформы
    if (player.isLedgeClimbing) {
      player.vy = -200;
      player.vx = player.facing * 110;
      if (player.vy > -10) player.isLedgeClimbing = false;
    }

    // Зарядка прыжка (без ограничения выносливости)
    if (player.isGrounded && input.jumpHeld) {
      player.chargeTime = Math.min(player.chargeTime + dt * 3.2, 1.0);
      player.squash = 1.35;
      player.stretch = 0.7;
      player.vx *= 0.65;
    } else if (player.chargeTime > 0) {
      // Мощный толчок
      const jumpPower = 440 + player.chargeTime * 440;
      player.vy = -jumpPower;
      player.vx += player.facing * (130 * player.chargeTime);
      player.isGrounded = false;
      player.squash = 0.65;
      player.stretch = 1.45;
      player.chargeTime = 0;
      sfx.jump();
      haptic('light');
      emitDust(player.x, player.y + player.r, 8);
    }

    // Горизонтальный разгон
    const accel = player.isGrounded ? 1200 : 480;
    if (input.left && !player.isLedgeClimbing) {
      player.vx -= accel * dt;
      player.facing = -1;
    } else if (input.right && !player.isLedgeClimbing) {
      player.vx += accel * dt;
      player.facing = 1;
    } else if (player.isGrounded) {
      player.vx *= GROUND_FRICTION;
    } else {
      player.vx *= AIR_RESIST;
    }

    const maxSpeed = 340;
    if (Math.abs(player.vx) > maxSpeed) {
      player.vx = Math.sign(player.vx) * maxSpeed;
    }

    // Гравитация
    if (!player.isLedgeClimbing) {
      player.vy += GRAVITY * dt;
    }

    player.x += player.vx * dt;
    player.y += player.vy * dt;

    // Анимация лапок и хвоста
    if (player.isGrounded && Math.abs(player.vx) > 20) {
      player.pawCycle += dt * 20;
    }
    player.tailAngle += (((player.vy * 0.0016) - (player.vx * 0.001)) - player.tailAngle) * 10 * dt;

    player.squash += (1 - player.squash) * 9 * dt;
    player.stretch += (1 - player.stretch) * 9 * dt;

    // Стены экрана (Wall-Jump)
    if (player.x - player.r < 10) {
      player.x = 10 + player.r;
      if (!player.isGrounded && input.jumpPressed) {
        player.vx = 320;
        player.vy = -520;
        player.facing = 1;
        player.stretch = 1.35;
        sfx.wall();
        haptic('medium');
        emitDust(player.x, player.y, 8);
      } else {
        player.vx = 0;
      }
    } else if (player.x + player.r > W - 10) {
      player.x = W - 10 - player.r;
      if (!player.isGrounded && input.jumpPressed) {
        player.vx = -320;
        player.vy = -520;
        player.facing = -1;
        player.stretch = 1.35;
        sfx.wall();
        haptic('medium');
        emitDust(player.x, player.y, 8);
      } else {
        player.vx = 0;
      }
    }
    input.jumpPressed = false;

    // Коллизии с платформами
    const wasGrounded = player.isGrounded;
    player.isGrounded = false;
    player.isLedgeClimbing = false;

    for (const p of platforms) {
      // Приземление сверху
      if (
        player.vy >= 0 &&
        player.x + player.r * 0.6 > p.x &&
        player.x - player.r * 0.6 < p.x + p.w &&
        player.y + player.r >= p.y &&
        player.y + player.r <= p.y + p.h + 12
      ) {
        const impact = player.vy;
        player.y = p.y - player.r;
        player.vy = 0;
        player.isGrounded = true;

        if (impact > 800) {
          if (input.crouch) {
            player.vx = player.facing * 280; // Паркур-ролл
            player.squash = 1.4;
            haptic('light');
          } else {
            player.stumbleTimer = 0.4;
            player.squash = 1.6;
            player.stretch = 0.55;
            haptic('heavy');
          }
          emitDust(player.x, player.y + player.r, 10);
        } else if (!wasGrounded) {
          player.squash = 1.25;
          player.stretch = 0.8;
          emitDust(player.x, player.y + player.r, 4);
        }
        break;
      }

      // Хват за край (Ledge Grab)
      if (!player.isGrounded && player.vy > -50 && player.vy < 380) {
        const leftEdge = Math.abs((player.x + player.r) - p.x) < 8 && Math.abs(player.y - p.y) < 14;
        const rightEdge = Math.abs((player.x - player.r) - (p.x + p.w)) < 8 && Math.abs(player.y - p.y) < 14;

        if (leftEdge || rightEdge) {
          player.isLedgeClimbing = true;
          player.facing = leftEdge ? 1 : -1;
          break;
        }
      }
    }

    // Сбор ягод
    for (const b of berries) {
      if (b.collected) continue;
      if (Math.hypot(player.x - b.x, player.y - b.y) < player.r + 12) {
        b.collected = true;
        player.berries++;
        sfx.berry();
        haptic('light');
        emitDust(b.x, b.y, 8, '#f43f5e');
        document.getElementById('berries-txt').innerText = player.berries;
      }
    }

    // Достижение святилища (Финал)
    if (finalShrine && !finalShrine.collected) {
      if (Math.hypot(player.x - (finalShrine.x + finalShrine.w / 2), player.y - (finalShrine.y - 20)) < 40) {
        triggerVictory();
      }
    }

    // Бесконечный спавн в режиме Endless
    if (endlessMode) {
      const topP = platforms[platforms.length - 1];
      if (topP && topP.y > cameraY - 300) {
        const w = 70 + Math.random() * 80;
        const x = 30 + Math.random() * (W - 60 - w);
        platforms.push({
          x,
          y: topP.y - (80 + Math.random() * 50),
          w,
          h: 18,
          zone: ZONES[3]
        });
      }
    }

    // Камера
    const targetCamY = player.y - H * 0.6;
    cameraY += (targetCamY - cameraY) * 5 * dt;

    // Высота и зона
    const hMeters = Math.max(0, (H - 150 - player.y) / 45);
    if (hMeters > maxHeight) maxHeight = hMeters;

    currentZone = getZone(maxHeight);
    document.getElementById('zone-sub').innerText = currentZone.sub;
    document.getElementById('zone-title').innerText = currentZone.name;
    document.getElementById('height-txt').innerText = `${maxHeight.toFixed(1)} м`;

    const progressPct = Math.min(100, Math.floor((maxHeight / 100) * 100));
    document.getElementById('goal-percent').innerText = `${progressPct}%`;
    document.getElementById('climb-bar').style.width = `${progressPct}%`;

    // Падение вниз
    if (player.y > cameraY + H + 120) {
      player.reset();
      initWorld();
    }

    // Частицы
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Конфетти
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      c.vy += 300 * dt;
      c.life -= dt;
      if (c.life <= 0) confetti.splice(i, 1);
    }
  }

  // Отрисовка
  function drawChinchilla(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(player.facing * player.squash, player.stretch);

    const lean = (player.vx * 0.001) * player.facing;
    ctx.rotate(lean);

    // Хвост
    ctx.save();
    ctx.translate(-player.r * 0.7, player.r * 0.1);
    ctx.rotate(-player.tailAngle);
    ctx.beginPath();
    ctx.ellipse(-14, -4, 16, 8, -0.2, 0, Math.PI * 2);
    ctx.fillStyle = '#64748b';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-24, -8, 12, 6, -0.4, 0, Math.PI * 2);
    ctx.fillStyle = '#475569';
    ctx.fill();
    ctx.restore();

    // Задняя лапка
    ctx.beginPath();
    ctx.ellipse(-player.r * 0.2, player.r * 0.65, 8, 5, 0.2, 0, Math.PI * 2);
    ctx.fillStyle = '#e2e8f0';
    ctx.fill();

    // Тело
    ctx.beginPath();
    ctx.ellipse(0, 0, player.r * 1.1, player.r * 0.95, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#94a3b8';
    ctx.fill();

    // Светлый животик
    ctx.beginPath();
    ctx.ellipse(player.r * 0.35, player.r * 0.15, player.r * 0.6, player.r * 0.65, 0.1, 0, Math.PI * 2);
    ctx.fillStyle = '#f8fafc';
    ctx.fill();

    // Передние лапки
    ctx.beginPath();
    const pawShift = Math.sin(player.pawCycle) * 3;
    ctx.ellipse(player.r * 0.5 + pawShift, player.r * 0.55, 4, 3, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#fbcfe8';
    ctx.fill();

    // Ушки
    ctx.beginPath();
    ctx.ellipse(-player.r * 0.3, -player.r * 0.9, 6, 12, -0.25, 0, Math.PI * 2);
    ctx.fillStyle = '#64748b';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-player.r * 0.3, -player.r * 0.9, 3.5, 8, -0.25, 0, Math.PI * 2);
    ctx.fillStyle = '#fda4af';
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(player.r * 0.25, -player.r * 0.9, 6, 12, 0.2, 0, Math.PI * 2);
    ctx.fillStyle = '#64748b';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(player.r * 0.25, -player.r * 0.9, 3.5, 8, 0.2, 0, Math.PI * 2);
    ctx.fillStyle = '#fda4af';
    ctx.fill();

    // Глаз
    ctx.beginPath();
    ctx.arc(player.r * 0.45, -player.r * 0.15, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = '#090d16';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(player.r * 0.48, -player.r * 0.18, 1.2, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    // Носик и усы
    ctx.beginPath();
    ctx.arc(player.r * 0.88, 0, 2, 0, Math.PI * 2);
    ctx.fillStyle = '#fb7185';
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(player.r * 0.8, -1); ctx.lineTo(player.r * 1.4, -4);
    ctx.moveTo(player.r * 0.8, 1);  ctx.lineTo(player.r * 1.5, 2);
    ctx.moveTo(player.r * 0.8, 3);  ctx.lineTo(player.r * 1.35, 7);
    ctx.stroke();

    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    // Градиент текущего биома/этажа
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, currentZone.bg1);
    bg.addColorStop(1, currentZone.bg2);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(0, -cameraY);

    // Платформы
    for (const p of platforms) {
      const z = p.zone || currentZone;
      ctx.fillStyle = z.platColor || '#475569';
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, p.h, 6);
      ctx.fill();

      // Верхняя светлая фаска
      ctx.fillStyle = z.platEdge || '#94a3b8';
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, 3, [6, 6, 0, 0]);
      ctx.fill();
    }

    // Финальное святилище с Золотым Шиповником
    if (finalShrine) {
      // Пьедестал
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.roundRect(finalShrine.x + finalShrine.w / 2 - 16, finalShrine.y - 12, 32, 12, 4);
      ctx.fill();

      // Золотой Шиповник (Артефакт)
      ctx.beginPath();
      ctx.arc(finalShrine.x + finalShrine.w / 2, finalShrine.y - 24, 12, 0, Math.PI * 2);
      ctx.fillStyle = '#f59e0b';
      ctx.fill();

      // Сияние
      ctx.beginPath();
      ctx.arc(finalShrine.x + finalShrine.w / 2, finalShrine.y - 24, 20, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(250, 204, 21, 0.25)';
      ctx.fill();
    }

    // Лакомства (Сушеный шиповник)
    for (const b of berries) {
      if (b.collected) continue;
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fda4af';
      ctx.beginPath();
      ctx.arc(b.x - 2, b.y - 2, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    // Частицы
    for (const pt of particles) {
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Конфетти при победе
    for (const c of confetti) {
      ctx.fillStyle = c.color;
      ctx.fillRect(c.x, c.y, c.size, c.size);
    }

    // Шиншилла
    drawChinchilla(player.x, player.y);

    ctx.restore();
  }

  function frame(now) {
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.033) dt = 0.033;

    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  initWorld();
  requestAnimationFrame(frame);
</script>
</body>
