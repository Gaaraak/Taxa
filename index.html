<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Такса vs Шиншилла</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0d17;
      --card: #151828;
      --accent: #f59e0b;
      --btn: #ef4444;
      --bonus: #10b981;
      --chinchilla: #a0aec0;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      overflow: hidden;
      touch-action: manipulation;
    }

    header {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
    }

    .badge {
      background: var(--card);
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      height: 420px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      border: 2px solid #282c40;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 17, 26, 0.88);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 10;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h2 {
      font-size: 1.85rem;
      color: var(--accent);
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(245, 158, 11, 0.4);
    }

    .overlay p {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .btn {
      background: var(--btn);
      color: #fff;
      font-size: 1.15rem;
      font-weight: 800;
      padding: 14px 34px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
      transition: transform 0.1s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .controls-hint {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">🌭 Длина: <span id="length-val" style="color: var(--accent);">1</span> м</div>
    <div class="badge">Время: <span id="time-val">☀️ День</span></div>
    <div class="badge">🏆 Рекорд: <span id="best-val">0</span> м</div>
  </header>

  <div id="game-container">
    <canvas id="canvas" width="440" height="420"></canvas>

    <div class="overlay" id="overlay">
      <h2 id="overlay-title">🐶 Побег от Шиншиллы!</h2>
      <p id="overlay-desc">
        • Тапай для прыжка (двойной тап = двойной прыжок)<br>
        • Собирай 🌭 для роста и 🌰 для турбо-ускорения<br>
        • Не дай рычащей шиншилле 🐭 тебя поймать!
      </p>
      <button class="btn" id="start-btn" onclick="startGame()">УБЕГАТЬ!</button>
    </div>
  </div>

  <div class="controls-hint">Двойной тап в воздухе = двойной прыжок!</div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function haptic(type) {
      if (!tg?.HapticFeedback) return;
      if (type === 'impact') tg.HapticFeedback.impactOccurred('medium');
      if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
      if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
    }

    // Аудиодвижок
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function soundJump(isDouble = false) {
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(isDouble ? 460 : 320, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(isDouble ? 680 : 500, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch(e){}
    }

    function soundEat() {
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(540, audioCtx.currentTime);
        osc.frequency.setValueAtTime(740, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.18);
      } catch(e){}
    }

    // Процедурный синтез рычания / сердитого шипения шиншиллы
    function soundChinchillaGrowl() {
      initAudio();
      try {
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const mod = audioCtx.createOscillator();
        const modGain = audioCtx.createGain();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(95, t);
        osc.frequency.linearRampToValueAtTime(65, t + 0.35);

        // Частотная модуляция для хриплого рычания
        mod.type = 'square';
        mod.frequency.setValueAtTime(38, t);
        modGain.gain.setValueAtTime(60, t);
        mod.connect(osc.frequency);

        gain.gain.setValueAtTime(0.2, t);
        gain.gain.linearRampToValueAtTime(0.28, t + 0.15);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.35);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        mod.start(t);
        osc.start(t);
        mod.stop(t + 0.35);
        osc.stop(t + 0.35);
      } catch(e){}
    }

    function soundHit() {
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.28);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.28);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.28);
      } catch(e){}
    }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const lengthVal = document.getElementById('length-val');
    const timeVal = document.getElementById('time-val');
    const bestVal = document.getElementById('best-val');

    let bestScore = parseInt(localStorage.getItem('taxa_chinchilla_best') || '1');
    bestVal.textContent = bestScore;

    const taxaImg = new Image();
    taxaImg.src = 'taxa.jpg';

    let isPlaying = false;
    let frame = 0;
    const groundY = 345;
    let speed = 4.2;
    let boostTimer = 0;

    const DAY_CYCLE_FRAMES = 1200;

    const taxa = {
      x: 80,
      y: groundY - 32,
      baseW: 36,
      segmentLen: 12,
      segments: 2,
      h: 28,
      vy: 0,
      gravity: 0.72,
      jumpForce: -11.5,
      jumpsLeft: 2
    };

    let items = [];
    let particles = [];
    let clouds = [
      { x: 30, y: 40, s: 0.5 },
      { x: 220, y: 65, s: 0.7 },
      { x: 380, y: 35, s: 0.4 }
    ];

    let stars = [];
    for (let i = 0; i < 35; i++) {
      stars.push({
        x: Math.random() * 440,
        y: Math.random() * (groundY - 80),
        size: 1 + Math.random() * 2,
        twinkleOffset: Math.random() * Math.PI * 2
      });
    }

    function createDust(x, y) {
      for (let i = 0; i < 3; i++) {
        particles.push({
          x: x + Math.random() * 8,
          y: y + Math.random() * 4,
          vx: -(speed * 0.4) - Math.random() * 1.5,
          vy: -Math.random() * 1.2,
          alpha: 0.7,
          size: 3 + Math.random() * 3
        });
      }
    }

    function resetGame() {
      taxa.y = groundY - taxa.h;
      taxa.vy = 0;
      taxa.segments = 2;
      taxa.jumpsLeft = 2;
      speed = 4.2;
      boostTimer = 0;
      items = [];
      particles = [];
      frame = 0;
      updateUI();
    }

    function updateUI() {
      const curLen = Math.floor(taxa.segments * 0.5);
      lengthVal.textContent = curLen;
      if (curLen > bestScore) {
        bestScore = curLen;
        localStorage.setItem('taxa_chinchilla_best', bestScore);
        bestVal.textContent = bestScore;
      }
    }

    function handleJump() {
      if (!isPlaying) return;
      initAudio();

      if (taxa.jumpsLeft > 0) {
        const isDouble = (taxa.jumpsLeft === 1);
        taxa.vy = isDouble ? taxa.jumpForce * 0.95 : taxa.jumpForce;
        taxa.jumpsLeft--;
        soundJump(isDouble);
        haptic(isDouble ? 'heavy' : 'impact');
        createDust(taxa.x - (taxa.segments * taxa.segmentLen), groundY);
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      handleJump();
    });

    function spawnItems() {
      // 1. Сосиски
      if (frame % 75 === 0) {
        items.push({
          type: 'sausage',
          x: canvas.width + 20,
          y: groundY - 32 - Math.random() * 65,
          w: 36,
          h: 18
        });
      }

      // 2. Орешек (турбо-ускорение)
      if (frame % 320 === 0 && Math.random() > 0.3) {
        items.push({
          type: 'nut',
          x: canvas.width + 30,
          y: groundY - 65 - Math.random() * 40,
          w: 24,
          h: 24
        });
      }

      // 3. Бревно
      if (frame % 160 === 0 && frame > 40) {
        items.push({ type: 'log', x: canvas.width + 30, y: groundY - 26, w: 34, h: 26 });
      }

      // 4. Нападающая ШИНШИЛЛА (на земле или сверху)
      if (frame % 190 === 0 && frame > 60) {
        const isFlying = Math.random() > 0.5;
        items.push({
          type: 'chinchilla',
          x: canvas.width + 35,
          y: isFlying ? groundY - 85 - Math.random() * 25 : groundY - 34,
          w: 38,
          h: 34,
          isFlying: isFlying,
          baseY: isFlying ? groundY - 90 : groundY - 34
        });
        soundChinchillaGrowl();
        haptic('heavy');
      }
    }

    function gameOver() {
      isPlaying = false;
      soundHit();
      haptic('error');

      overlayTitle.textContent = 'Шиншилла поймала таксу! 🐭💥';
      overlayDesc.innerHTML = `Такса успела вырасти до <b>${Math.floor(taxa.segments * 0.5)} м</b>!<br>Берегись рычания шиншиллы в следующий раз!`;
      document.getElementById('start-btn').textContent = 'ПОПРОБОВАТЬ СНОВА';
      overlay.classList.remove('hidden');
    }

    function update() {
      if (!isPlaying) return;
      frame++;

      if (boostTimer > 0) boostTimer--;

      const cycleProg = (frame % DAY_CYCLE_FRAMES) / DAY_CYCLE_FRAMES;
      const isNight = cycleProg > 0.45 && cycleProg < 0.95;
      timeVal.textContent = isNight ? '🌙 Ночь' : '☀️ День';

      taxa.vy += taxa.gravity;
      taxa.y += taxa.vy;

      if (taxa.y >= groundY - taxa.h) {
        taxa.y = groundY - taxa.h;
        taxa.vy = 0;
        taxa.jumpsLeft = 2;
        if (frame % 6 === 0) {
          createDust(taxa.x - (taxa.segments * taxa.segmentLen) + 10, groundY - 2);
        }
      }

      clouds.forEach(c => {
        c.x -= c.s * 0.8;
        if (c.x < -60) c.x = canvas.width + 40;
      });

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.025;
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      spawnItems();

      const currentSpeed = boostTimer > 0 ? speed * 1.5 : speed;

      for (let i = items.length - 1; i >= 0; i--) {
        const obj = items[i];
        obj.x -= currentSpeed;

        if (obj.type === 'chinchilla' && obj.isFlying) {
          obj.y = obj.baseY + Math.sin(frame * 0.12) * 15;
        }

        const taxaTailX = taxa.x - (taxa.segments * taxa.segmentLen);

        if (obj.type === 'sausage') {
          if (
            taxa.x + taxa.baseW > obj.x &&
            taxaTailX < obj.x + obj.w &&
            taxa.y + taxa.h > obj.y &&
            taxa.y < obj.y + obj.h
          ) {
            taxa.segments++;
            speed = Math.min(8.8, 4.2 + taxa.segments * 0.12);
            soundEat();
            haptic('impact');
            items.splice(i, 1);
            updateUI();
            continue;
          }
        }

        if (obj.type === 'nut') {
          if (
            taxa.x + taxa.baseW > obj.x &&
            taxaTailX < obj.x + obj.w &&
            taxa.y + taxa.h > obj.y &&
            taxa.y < obj.y + obj.h
          ) {
            boostTimer = 220; // ускорение
            soundEat();
            haptic('success');
            items.splice(i, 1);
            continue;
          }
        }

        if (obj.type === 'log' || obj.type === 'chinchilla') {
          const hitHeadX = taxa.x + 8;
          if (
            hitHeadX + 24 > obj.x + 4 &&
            hitHeadX < obj.x + obj.w - 4 &&
            taxa.y + taxa.h > obj.y + 4 &&
            taxa.y < obj.y + obj.h - 4
          ) {
            if (boostTimer > 0) {
              // В режиме турбо такса сбивает шиншиллу/бревно
              soundHit();
              haptic('heavy');
              items.splice(i, 1);
              continue;
            } else {
              gameOver();
              return;
            }
          }
        }

        if (obj.x < -70) items.splice(i, 1);
      }
    }

    function interpolateColor(color1, color2, factor) {
      const result = color1.slice();
      for (let i = 0; i < 3; i++) {
        result[i] = Math.round(result[i] + factor * (color2[i] - color1[i]));
      }
      return `rgb(${result[0]}, ${result[1]}, ${result[2]})`;
    }

    // --- ОТРИСОВКА РЕАЛИСТИЧНОЙ ШИНШИЛЛЫ ---
    function drawRealisticChinchilla(x, y, w, h, isFlying) {
      ctx.save();
      const jumpBob = isFlying ? 0 : Math.abs(Math.sin(frame * 0.3)) * 6;
      ctx.translate(x + w / 2, y + h / 2 - jumpBob);

      // Пушистый длинный хвост дугой вверх
      ctx.strokeStyle = '#8d99ae';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(10, 6);
      ctx.quadraticCurveTo(24, -4, 20, -16);
      ctx.stroke();

      ctx.strokeStyle = '#d0d6df';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(10, 6);
      ctx.quadraticCurveTo(24, -4, 20, -16);
      ctx.stroke();

      // Круглое пушистое тело
      const furGrad = ctx.createRadialGradient(-2, 0, 4, 0, 0, 16);
      furGrad.addColorStop(0, '#edf2f7');
      furGrad.addColorStop(0.5, '#a0aec0');
      furGrad.addColorStop(1, '#4a5568');
      ctx.fillStyle = furGrad;
      ctx.beginPath();
      ctx.ellipse(0, 4, 15, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      // Круглая голова
      ctx.beginPath();
      ctx.arc(-8, -2, 10, 0, Math.PI * 2);
      ctx.fill();

      // Большие круглые ушки шиншиллы
      ctx.fillStyle = '#718096';
      ctx.beginPath();
      ctx.ellipse(-6, -15, 5, 8, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fbb6ce'; // розовая внутренняя часть
      ctx.beginPath();
      ctx.ellipse(-6, -15, 2.5, 5, -0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#718096';
      ctx.beginPath();
      ctx.ellipse(2, -14, 5, 8, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fbb6ce';
      ctx.beginPath();
      ctx.ellipse(2, -14, 2.5, 5, 0.2, 0, Math.PI * 2);
      ctx.fill();

      // Чёрный блестящий глаз бусинка
      ctx.fillStyle = '#1a202c';
      ctx.beginPath();
      ctx.arc(-11, -3, 2.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-12, -4, 1, 0, Math.PI * 2);
      ctx.fill();

      // Розовый носик
      ctx.fillStyle = '#f687b3';
      ctx.beginPath();
      ctx.arc(-17, 0, 1.8, 0, Math.PI * 2);
      ctx.fill();

      // Тонкие длинные усы
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-16, 0);
      ctx.lineTo(-24, -4);
      ctx.moveTo(-16, 1);
      ctx.lineTo(-25, 2);
      ctx.moveTo(-16, 2);
      ctx.lineTo(-23, 7);
      ctx.stroke();

      // Маленькие лапки
      ctx.fillStyle = '#fbb6ce';
      ctx.beginPath();
      ctx.arc(-6, 15, 3, 0, Math.PI * 2);
      ctx.arc(4, 15, 3.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawRealisticSausage(x, y, w, h) {
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2);
      ctx.rotate(-0.08);

      const grad = ctx.createLinearGradient(0, -h/2, 0, h/2);
      grad.addColorStop(0, '#c0392b');
      grad.addColorStop(0.3, '#d35400');
      grad.addColorStop(0.7, '#a93226');
      grad.addColorStop(1, '#78281f');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(-w/2, -h/2, w, h, 8);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 230, 200, 0.45)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.roundRect(-w/2 + 4, -h/2 + 2, w - 8, 3, 2);
      ctx.stroke();

      ctx.strokeStyle = '#4a1712';
      ctx.lineWidth = 2;
      for (let offset = -w/3; offset <= w/3; offset += 9) {
        ctx.beginPath();
        ctx.moveTo(offset, -h/2 + 3);
        ctx.lineTo(offset + 3, h/2 - 3);
        ctx.stroke();
      }

      ctx.fillStyle = '#641e16';
      ctx.beginPath();
      ctx.arc(-w/2 - 1, 0, 2.5, 0, Math.PI * 2);
      ctx.arc(w/2 + 1, 0, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawRealisticNut(x, y, w, h) {
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2);
      // Свечение орешка
      ctx.shadowColor = '#f59e0b';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#d97706';
      ctx.beginPath();
      ctx.arc(0, 0, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#b45309';
      ctx.beginPath();
      ctx.arc(0, -3, 8, Math.PI, 0);
      ctx.fill();
      ctx.restore();
    }

    function drawRealisticLog(x, y, w, h) {
      ctx.save();
      const barkGrad = ctx.createLinearGradient(x, y, x, y + h);
      barkGrad.addColorStop(0, '#5c4033');
      barkGrad.addColorStop(0.5, '#3e2723');
      barkGrad.addColorStop(1, '#2c1810');
      ctx.fillStyle = barkGrad;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 6);
      ctx.fill();

      ctx.fillStyle = '#d7ccc8';
      ctx.beginPath();
      ctx.ellipse(x + 5, y + h/2, 5, h/2 - 2, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#8d6e63';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(x + 5, y + h/2, 3, h/4, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawRealisticDachshund(taxa, groundY) {
      const bodyY = taxa.y + 4;
      const bodyH = 20;
      const totalBodyLen = taxa.segments * taxa.segmentLen;
      const legRun = Math.sin(frame * 0.42) * 6;

      ctx.save();

      // Эффект турбо-ускорения от ореха
      if (boostTimer > 0) {
        ctx.strokeStyle = `rgba(245, 158, 11, ${0.4 + Math.sin(frame * 0.3) * 0.3})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.roundRect(taxa.x - totalBodyLen - 12, bodyY - 10, totalBodyLen + 46, bodyH + 26, 16);
        ctx.stroke();
      }

      // Хвост таксы
      ctx.strokeStyle = '#1d120c';
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(taxa.x - totalBodyLen + 2, bodyY + 6);
      ctx.quadraticCurveTo(taxa.x - totalBodyLen - 8, bodyY - 2 + Math.sin(frame * 0.35) * 4, taxa.x - totalBodyLen - 12, bodyY - 6 + Math.sin(frame * 0.35) * 3);
      ctx.stroke();

      // Задние лапки
      ctx.strokeStyle = '#1f130b';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(taxa.x - totalBodyLen + 6, bodyY + bodyH - 2);
      ctx.lineTo(taxa.x - totalBodyLen + 6 - (taxa.vy === 0 ? legRun : 3), bodyY + bodyH + 9);
      ctx.stroke();

      // ТЕЛО ТАКСЫ
      const bodyGrad = ctx.createLinearGradient(0, bodyY, 0, bodyY + bodyH);
      bodyGrad.addColorStop(0, '#2d1c14');
      bodyGrad.addColorStop(0.4, '#1b110b');
      bodyGrad.addColorStop(0.85, '#22140d');
      bodyGrad.addColorStop(1, '#a65b29');

      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.roundRect(taxa.x - totalBodyLen, bodyY, totalBodyLen + 18, bodyH, 10);
      ctx.fill();

      // Передние лапки
      ctx.strokeStyle = '#1f130b';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(taxa.x + 10, bodyY + bodyH - 2);
      ctx.lineTo(taxa.x + 10 + (taxa.vy === 0 ? legRun : -2), bodyY + bodyH + 9);
      ctx.stroke();

      // Ошейник
      ctx.fillStyle = '#b71515';
      ctx.fillRect(taxa.x + 12, bodyY + 1, 6, bodyH - 3);

      // Голова таксы (фото)
      const headX = taxa.x + 14;
      const headY = taxa.y - 7;
      const headSize = 35;

      if (taxaImg.complete && taxaImg.naturalWidth !== 0) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(headX + headSize/2, headY + headSize/2, headSize/2, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(taxaImg, headX, headY, headSize, headSize);
        ctx.restore();

        ctx.strokeStyle = '#a65b29';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(headX + headSize/2, headY + headSize/2, headSize/2, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#1c120c';
        ctx.beginPath();
        ctx.ellipse(headX + 16, headY + 16, 14, 10, 0.1, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // ДЕНЬ / НОЧЬ
      const cycle = (frame % DAY_CYCLE_FRAMES) / DAY_CYCLE_FRAMES;
      const nightFactor = Math.sin(cycle * Math.PI);

      const dayTop = [70, 140, 240];
      const dayBottom = [170, 215, 255];
      const nightTop = [8, 12, 30];
      const nightBottom = [24, 32, 60];

      const curSkyTop = interpolateColor(dayTop, nightTop, nightFactor);
      const curSkyBottom = interpolateColor(dayBottom, nightBottom, nightFactor);

      const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
      skyGrad.addColorStop(0, curSkyTop);
      skyGrad.addColorStop(1, curSkyBottom);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, groundY);

      if (nightFactor > 0.25) {
        const starAlpha = Math.min(1, (nightFactor - 0.25) * 1.5);
        stars.forEach(st => {
          const twinkle = 0.5 + 0.5 * Math.sin(frame * 0.08 + st.twinkleOffset);
          ctx.fillStyle = `rgba(255, 255, 255, ${starAlpha * twinkle})`;
          ctx.beginPath();
          ctx.arc(st.x, st.y, st.size, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      const celestialAngle = cycle * Math.PI * 2 - Math.PI / 2;
      const celestialRadius = 150;
      const centerX = canvas.width / 2;
      const centerY = groundY - 40;

      const sunX = centerX + Math.cos(celestialAngle) * celestialRadius;
      const sunY = centerY + Math.sin(celestialAngle) * 90;
      if (sunY < groundY + 20) {
        ctx.fillStyle = '#f59e0b';
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(sunX, sunY, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      const moonX = centerX + Math.cos(celestialAngle + Math.PI) * celestialRadius;
      const moonY = centerY + Math.sin(celestialAngle + Math.PI) * 90;
      if (moonY < groundY + 20) {
        ctx.fillStyle = '#e2e8f0';
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(moonX, moonY, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = curSkyTop;
        ctx.beginPath();
        ctx.arc(moonX + 5, moonY - 3, 11, 0, Math.PI * 2);
        ctx.fill();
      }

      const cloudAlpha = 0.25 - (nightFactor * 0.15);
      ctx.fillStyle = `rgba(255, 255, 255, ${cloudAlpha})`;
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 22, 0, Math.PI * 2);
        ctx.arc(c.x + 18, c.y - 8, 28, 0, Math.PI * 2);
        ctx.arc(c.x + 36, c.y, 20, 0, Math.PI * 2);
        ctx.fill();
      });

      // Земля
      const dayGrass = [34, 197, 94];
      const nightGrass = [15, 80, 42];
      ctx.fillStyle = interpolateColor(dayGrass, nightGrass, nightFactor);
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      const daySoil = [22, 163, 74];
      const nightSoil = [9, 58, 30];
      ctx.fillStyle = interpolateColor(daySoil, nightSoil, nightFactor);
      ctx.fillRect(0, groundY + 8, canvas.width, 5);

      particles.forEach(p => {
        ctx.fillStyle = `rgba(200, 200, 200, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Отрисовка объектов
      for (const obj of items) {
        if (obj.type === 'sausage') {
          drawRealisticSausage(obj.x, obj.y, obj.w, obj.h);
        } else if (obj.type === 'nut') {
          drawRealisticNut(obj.x, obj.y, obj.w, obj.h);
        } else if (obj.type === 'log') {
          drawRealisticLog(obj.x, obj.y, obj.w, obj.h);
        } else if (obj.type === 'chinchilla') {
          drawRealisticChinchilla(obj.x, obj.y, obj.w, obj.h, obj.isFlying);
        }
      }

      // Отрисовка таксы
      drawRealisticDachshund(taxa, groundY);
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      initAudio();
      resetGame();
      overlay.classList.add('hidden');
      isPlaying = true;
      haptic('impact');
    }

    resetGame();
    gameLoop();
  </script>
</body>
