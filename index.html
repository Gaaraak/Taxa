<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Космо-Кейс Продюсера</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --space-dark: #050711;
      --panel: rgba(13, 17, 34, 0.75);
      --border: rgba(99, 102, 241, 0.25);
      --gold: #f59e0b;
      --cyan: #38bdf8;
      --purple: #c084fc;
      --common: #64748b;
      --rare: #38bdf8;
      --epic: #c084fc;
      --legendary: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--space-dark);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)) 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Фоновый космос */
    #space-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    header, .cosmic-stage, .drop-display, .action-panel {
      position: relative;
      z-index: 2;
    }

    /* Верхний блок */
    header {
      text-align: center;
      margin-top: 4px;
    }

    .badge-top {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 11px;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 800;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
      margin-bottom: 6px;
    }

    .badge-top .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    header h1 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(180deg, #ffffff 40%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
    }

    /* Космическая арена с персонажами */
    .cosmic-stage {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 10px 0;
    }

    .astro-hero {
      width: 58px;
      height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.35));
      animation: zeroGravity 3s ease-in-out infinite alternate;
    }

    .astro-hero.right {
      animation-delay: -1.5s;
      filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.35));
    }

    @keyframes zeroGravity {
      0% { transform: translateY(-5px) rotate(-3deg); }
      100% { transform: translateY(6px) rotate(3deg); }
    }

    /* Рулетка в центре */
    .roulette-wrap {
      position: relative;
      flex: 1;
      height: 140px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(99, 102, 241, 0.2);
      display: flex;
      align-items: center;
    }

    .roulette-wrap::before, .roulette-wrap::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 45px;
      z-index: 5;
      pointer-events: none;
    }
    .roulette-wrap::before {
      left: 0;
      background: linear-gradient(90deg, #070914 20%, transparent);
    }
    .roulette-wrap::after {
      right: 0;
      background: linear-gradient(-90deg, #070914 20%, transparent);
    }

    /* Лазерная шкала */
    .marker {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 100%;
      background: linear-gradient(180deg, #38bdf8, #f59e0b);
      box-shadow: 0 0 16px #38bdf8, 0 0 6px #fff;
      z-index: 10;
    }
    .marker::before, .marker::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
    }
    .marker::before {
      top: 2px;
      border-top: 8px solid #38bdf8;
    }
    .marker::after {
      bottom: 2px;
      border-bottom: 8px solid #f59e0b;
    }

    .tape {
      display: flex;
      gap: 12px;
      padding-left: 150px;
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }

    .card {
      flex-shrink: 0;
      width: 102px;
      height: 112px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-align: center;
      padding: 6px;
    }

    .card .ico {
      font-size: 24px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }
    .card .type-lbl {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .card .meta-lbl {
      font-size: 9px;
      color: #94a3b8;
      font-weight: 600;
    }

    .card.common { border-bottom: 3px solid var(--common); }
    .card.common .type-lbl { color: var(--common); }

    .card.rare { border-bottom: 3px solid var(--rare); background: rgba(56, 189, 248, 0.05); }
    .card.rare .type-lbl { color: var(--rare); }

    .card.epic { border-bottom: 3px solid var(--epic); background: rgba(192, 132, 252, 0.06); }
    .card.epic .type-lbl { color: var(--epic); }

    .card.legendary { 
      border-bottom: 3px solid var(--legendary); 
      background: radial-gradient(circle, rgba(251, 191, 36, 0.15), rgba(255, 255, 255, 0.02));
    }
    .card.legendary .type-lbl { color: var(--legendary); }

    /* Окно дропа */
    .drop-display {
      width: 100%;
      max-width: 440px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      min-height: 190px;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .drop-rarity {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #64748b;
    }

    .drop-title {
      font-size: 21px;
      font-weight: 900;
      color: #fff;
    }

    .drop-desc {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.4;
      max-width: 320px;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 4px;
    }

    .spec-tag {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      color: #e2e8f0;
    }

    /* Панель кнопок */
    .action-panel {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-main {
      width: 100%;
      padding: 16px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: #fff;
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
      transition: transform 0.08s ease;
    }

    .btn-main:active {
      transform: scale(0.97);
    }

    .btn-main:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-share {
      width: 100%;
      padding: 14px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <canvas id="space-bg"></canvas>

  <header>
    <div class="badge-top">
      <span class="pulse-dot"></span>
      <span>Орбитальная Студия</span>
    </div>
    <h1>КЕЙС ПРОДЮСЕРА</h1>
  </header>

  <div class="cosmic-stage">
    <!-- Астро-Шиншилла слева -->
    <div class="astro-hero" id="hero-chinchilla">
      <svg width="56" height="78" viewBox="0 0 56 78" fill="none">
        <!-- Антенна скафандра -->
        <line x1="28" y1="12" x2="28" y2="2" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
        <circle cx="28" cy="2" r="2.5" fill="#38bdf8"/>
        <!-- Прозрачный шлем -->
        <circle cx="28" cy="24" r="18" fill="rgba(56, 189, 248, 0.18)" stroke="#38bdf8" stroke-width="1.8"/>
        <ellipse cx="23" cy="18" rx="5" ry="2.5" fill="rgba(255,255,255,0.4)" transform="rotate(-25 23 18)"/>
        <!-- Ушки шиншиллы внутри шлема -->
        <ellipse cx="18" cy="16" rx="4" ry="7" fill="#64748b" transform="rotate(-15 18 16)"/>
        <ellipse cx="18" cy="16" rx="2.2" ry="4.5" fill="#fda4af" transform="rotate(-15 18 16)"/>
        <ellipse cx="38" cy="16" rx="4" ry="7" fill="#64748b" transform="rotate(15 38 16)"/>
        <ellipse cx="38" cy="16" rx="2.2" ry="4.5" fill="#fda4af" transform="rotate(15 38 16)"/>
        <!-- Мордочка шиншиллы -->
        <ellipse cx="28" cy="26" rx="11" ry="9" fill="#94a3b8"/>
        <ellipse cx="28" cy="28" rx="6.5" ry="5.5" fill="#f8fafc"/>
        <circle cx="24" cy="24" r="2" fill="#090d16"/>
        <circle cx="32" cy="24" r="2" fill="#090d16"/>
        <circle cx="28" cy="27" r="1.3" fill="#fb7185"/>
        <!-- Костюм-скафандр -->
        <rect x="16" y="40" width="24" height="26" rx="8" fill="#e2e8f0"/>
        <rect x="22" y="46" width="12" height="9" rx="3" fill="#38bdf8"/>
        <!-- Лапки -->
        <circle cx="12" cy="48" r="4" fill="#cbd5e1"/>
        <circle cx="44" cy="48" r="4" fill="#cbd5e1"/>
        <!-- Хвост шиншиллы сзади -->
        <path d="M16 60 C8 58 6 68 12 72 C18 76 22 70 20 64" fill="#64748b"/>
      </svg>
    </div>

    <!-- Центральная рулетка -->
    <div class="roulette-wrap">
      <div class="marker"></div>
      <div class="tape" id="tape"></div>
    </div>

    <!-- Астро-Такса справа -->
    <div class="astro-hero right" id="hero-dachshund">
      <svg width="56" height="78" viewBox="0 0 56 78" fill="none">
        <!-- Реактивный ранец за спиной -->
        <rect x="36" y="32" width="8" height="20" rx="3" fill="#475569"/>
        <polygon points="40,54 36,62 44,62" fill="#f59e0b"/>
        <!-- Скафандр таксы -->
        <rect x="14" y="36" width="26" height="24" rx="8" fill="#854d0e"/>
        <!-- Полосатый космический свитер -->
        <rect x="18" y="36" width="6" height="24" fill="#dc2626"/>
        <rect x="28" y="36" width="6" height="24" fill="#facc15"/>
        <!-- Шлем скафандра вытянутый -->
        <ellipse cx="26" cy="24" rx="16" ry="14" fill="rgba(245, 158, 11, 0.18)" stroke="#f59e0b" stroke-width="1.8"/>
        <!-- Мордочка таксы -->
        <ellipse cx="24" cy="24" rx="10" ry="7.5" fill="#a16207"/>
        <ellipse cx="16" cy="26" rx="7" ry="4.5" fill="#a16207"/>
        <circle cx="11" cy="25" r="1.8" fill="#0f172a"/>
        <!-- Ухо таксы -->
        <ellipse cx="32" cy="22" rx="4" ry="10" fill="#713f12" transform="rotate(25 32 22)"/>
        <!-- Глаз -->
        <circle cx="22" cy="22" r="1.8" fill="#fff"/>
        <circle cx="21.5" cy="22" r="1" fill="#000"/>
        <!-- Лапки -->
        <rect x="16" y="60" width="5" height="10" rx="2.5" fill="#713f12"/>
        <rect x="30" y="60" width="5" height="10" rx="2.5" fill="#713f12"/>
      </svg>
    </div>
  </div>

  <div class="drop-display" id="display">
    <div class="drop-rarity">Связь со станцией установлена</div>
    <div class="drop-title">Что напишем сегодня? 🚀</div>
    <div class="drop-desc">Крути кейс, чтобы выбить космический стиль, темп и тональность для следующего трека.</div>
  </div>

  <div class="action-panel">
    <button class="btn-main" id="spin-btn">Открыть космо-кейс 🌌</button>
    <button class="btn-share" id="share-btn">Скопировать ТЗ в буфер 📋</button>
  </div>

<script>
  // Telegram WebApp
  const tg = window.Telegram?.WebApp;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      tg.headerColor = '#050711';
      tg.backgroundColor = '#050711';
    } catch(e) {}
  }

  function haptic(type = 'light') {
    try {
      if (tg?.HapticFeedback) {
        if (type === 'light') tg.HapticFeedback.impactOccurred('light');
        if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
        if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      }
    } catch(e) {}
  }

  // Фон: Космос с параллаксом
  const bgCanvas = document.getElementById('space-bg');
  const bgCtx = bgCanvas.getContext('2d');
  let stars = [];

  function resizeSpace() {
    bgCanvas.width = window.innerWidth;
    bgCanvas.height = window.innerHeight;
    stars = [];
    for (let i = 0; i < 50; i++) {
      stars.push({
        x: Math.random() * bgCanvas.width,
        y: Math.random() * bgCanvas.height,
        r: Math.random() * 1.5 + 0.5,
        a: Math.random() * 0.8 + 0.2,
        speed: Math.random() * 0.3 + 0.1
      });
    }
  }
  window.addEventListener('resize', resizeSpace);
  resizeSpace();

  function drawSpace() {
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

    // Туманность
    const grad = bgCtx.createRadialGradient(
      bgCanvas.width * 0.5, bgCanvas.height * 0.35, 10,
      bgCanvas.width * 0.5, bgCanvas.height * 0.35, bgCanvas.width * 0.7
    );
    grad.addColorStop(0, 'rgba(99, 102, 241, 0.15)');
    grad.addColorStop(0.5, 'rgba(56, 189, 248, 0.08)');
    grad.addColorStop(1, 'transparent');
    bgCtx.fillStyle = grad;
    bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

    // Звезды
    for (const s of stars) {
      bgCtx.fillStyle = `rgba(255, 255, 255, ${s.a})`;
      bgCtx.beginPath();
      bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      bgCtx.fill();

      s.y -= s.speed;
      if (s.y < 0) s.y = bgCanvas.height;
    }
    requestAnimationFrame(drawSpace);
  }
  drawSpace();

  // Web Audio
  class CosmicSound {
    constructor() { this.ctx = null; }
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    }
    tick() {
      if (!this.ctx) return;
      try {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(680, this.ctx.currentTime);
        g.gain.setValueAtTime(0.06, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.03);
      } catch(e) {}
    }
    win() {
      if (!this.ctx) return;
      [440, 554, 659, 880].forEach((f, i) => {
        setTimeout(() => {
          try {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, this.ctx.currentTime);
            g.gain.setValueAtTime(0.12, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.35);
          } catch(e) {}
        }, i * 100);
      });
    }
  }
  const sfx = new CosmicSound();

  // Задачи
  const ITEMS = [
    { type: 'Луп', name: 'Космический Drift Melody', bpm: '144 BPM', key: 'C Minor', rarity: 'common', ico: '🎹', desc: 'Детюненный синтовый лид с реверберацией и космическим фленджером.', tags: ['Space Lead', 'Drill', 'Detune'] },
    { type: 'Луп', name: 'Ambient Space Pad', bpm: '120 BPM', key: 'F# Minor', rarity: 'common', ico: '🌌', desc: 'Воздушный синт-пэд с фильтрацией высоких частот и текстурным шумом звезд.', tags: ['Nebula', 'Warm Pad', 'Chill'] },
    { type: 'Луп', name: 'Sub-Orbit 808 Glide', bpm: '140 BPM', key: 'D Minor', rarity: 'common', ico: '🔊', desc: 'Глубокий суб-бас с длинными слайдами по октавам.', tags: ['808 Glide', 'Deep Sub', 'Heavy'] },

    { type: 'Бит', name: 'Cyber Phonk / Drift', bpm: '140 BPM', key: 'A Minor', rarity: 'rare', ico: '🏎️', desc: 'Ковбелл с перегрузом, грязные акапеллы и раскатистая бочка.', tags: ['Phonk', 'Cowbell', 'Distortion'] },
    { type: 'Бит', name: 'Cosmic Trap Metal', bpm: '138 BPM', key: 'E Minor', rarity: 'rare', ico: '🔥', desc: 'Быстрые хэты с триолями, плотный снейр и ревущий 808 под агрессивный флоу.', tags: ['Trap Metal', 'Fast Hats', 'Heavy'] },
    { type: 'Луп', name: 'Hyper-Rage Arp', bpm: '152 BPM', key: 'G Major', rarity: 'rare', ico: '⚡', desc: 'Энергичный пилообразный арпеджиатор с портаменто.', tags: ['Rage', 'Hyperpop', 'Arp'] },

    { type: 'Бит', name: 'Starlight Hardstyle Beat', bpm: '158 BPM', key: 'G# Minor', rarity: 'epic', ico: '🔨', desc: 'Тяжелая дисторшн-бочка, реверсивный бас и взрывной дроп.', tags: ['Hardstyle', '158 BPM', 'Energy'] },
    { type: 'Бит', name: 'Alien Rage в стиле Yeat', bpm: '150 BPM', key: 'F Minor', rarity: 'epic', ico: '🛸', desc: 'Космические синт-паки, пробивной кик и футуристичный вайб.', tags: ['Rage', 'Yeat Style', 'Future'] },

    { type: 'Бит', name: 'Галактический Эксклюзив', bpm: '144 BPM', key: 'B Minor', rarity: 'legendary', ico: '👑', desc: 'Полный трек под ключ: интро с голосовым тегом, 2 куплета, бридж и дроп.', tags: ['Exclusive', 'Masterpiece', 'Cash'] },
    { type: 'Челлендж', name: 'Бит из 1 Сэмпла за 20 мин', bpm: 'Свободный', key: 'Любой', rarity: 'legendary', ico: '⏱️', desc: 'Запиши любой звук рядом и собери весь бит только из него.', tags: ['Challenge', 'Pro Skill', 'Speed'] }
  ];

  const tapeEl = document.getElementById('tape');
  const spinBtn = document.getElementById('spin-btn');
  const shareBtn = document.getElementById('share-btn');
  const displayEl = document.getElementById('display');

  const CARD_WIDTH = 114; // 102px + 12px gap
  let isSpinning = false;
  let tapeData = [];
  let currentTaskText = '';

  function createTape() {
    tapeEl.innerHTML = '';
    tapeData = [];
    
    for (let i = 0; i < 65; i++) {
      const item = ITEMS[Math.floor(Math.random() * ITEMS.length)];
      tapeData.push(item);

      const card = document.createElement('div');
      card.className = `card ${item.rarity}`;
      card.innerHTML = `
        <div class="ico">${item.ico}</div>
        <div class="type-lbl">${item.type}</div>
        <div class="meta-lbl">${item.bpm}</div>
      `;
      tapeEl.appendChild(card);
    }
  }
  createTape();

  function startSpin() {
    if (isSpinning) return;
    isSpinning = true;
    spinBtn.disabled = true;
    shareBtn.style.display = 'none';
    sfx.init();

    const winIndex = 48 + Math.floor(Math.random() * 8);
    const winItem = tapeData[winIndex];

    const microOffset = (Math.random() - 0.5) * 45;
    const rouletteWidth = document.querySelector('.roulette-wrap').offsetWidth;
    const targetX = (winIndex * CARD_WIDTH) + (CARD_WIDTH / 2) - (rouletteWidth / 2) + microOffset;

    tapeEl.style.transition = 'none';
    tapeEl.style.transform = 'translate3d(0, 0, 0)';

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        tapeEl.style.transition = 'transform 4.8s cubic-bezier(0.12, 0.82, 0.18, 1)';
        tapeEl.style.transform = `translate3d(-${targetX}px, 0, 0)`;

        let step = 0;
        const totalSteps = 30;
        function playTick() {
          if (step >= totalSteps) return;
          sfx.tick();
          haptic('light');
          step++;
          const nextDelay = 60 + Math.pow(step / totalSteps, 3.2) * 360;
          setTimeout(playTick, nextDelay);
        }
        playTick();
      });
    });

    setTimeout(() => {
      isSpinning = false;
      spinBtn.disabled = false;
      spinBtn.innerText = 'Крутить снова 🎲';
      sfx.win();
      haptic('heavy');

      renderResult(winItem);
    }, 4900);
  }

  function renderResult(item) {
    const colorVar = `var(--${item.rarity})`;
    displayEl.style.borderColor = colorVar;
    displayEl.style.boxShadow = `0 12px 35px rgba(0, 0, 0, 0.5), 0 0 25px ${colorVar}44`;

    displayEl.innerHTML = `
      <div class="drop-rarity" style="color: ${colorVar}">★ ${item.rarity.toUpperCase()} ★</div>
      <div class="drop-title">${item.ico} ${item.name}</div>
      <div class="drop-desc">${item.desc}</div>
      <div class="tag-row">
        <span class="spec-tag">⚡ ${item.type}</span>
        <span class="spec-tag">⏱️ ${item.bpm}</span>
        <span class="spec-tag">🎵 ${item.key}</span>
        ${item.tags.map(t => `<span class="spec-tag">#${t}</span>`).join('')}
      </div>
    `;

    currentTaskText = `🌌 Космическое ТЗ для продюсера:\n${item.ico} ${item.name}\nФормат: ${item.type} | ${item.bpm} | Тональность: ${item.key}\nПодробности: ${item.desc}\nТеги: ${item.tags.join(', ')}`;
    shareBtn.style.display = 'flex';
  }

  spinBtn.addEventListener('click', startSpin);

  shareBtn.addEventListener('click', () => {
    if (!currentTaskText) return;
    navigator.clipboard.writeText(currentTaskText).then(() => {
      shareBtn.innerText = 'Скопировано в буфер! ✅';
      haptic('medium');
      setTimeout(() => {
        shareBtn.innerText = 'Скопировать ТЗ в буфер 📋';
      }, 1500);
    });
  });
</script>
</body>
</html>
